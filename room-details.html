<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Room — Uyeh Hotel</title>
<meta name="description" id="pageDescription" content="Full details for this room — photos, amenities, and real-time availability.">
<meta name="theme-color" content="#14181f">
<meta name="robots" content="index, follow">
<meta property="og:image" content="/assets/og-default.jpg">
<meta name="twitter:image" content="/assets/og-default.jpg">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#14181f; --ink-soft:#1c222b; --ink-deep:#0d1015;
  --ivory:#f6f1e7; --ivory-dim:#ede5d4;
  --brass:#b98d45; --brass-light:#d9b876;
  --teal:#2f5d5a; --teal-light:#3f7a76;
  --text-muted:#6b6355; --text-on-ink:#ede6d6;
  --line-on-ink:rgba(237,230,214,0.16);
  --radius:3px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-in-out:cubic-bezier(0.87,0,0.13,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{font-family:var(--font-body);background:var(--ivory);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}#preloader{display:none!important}}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;line-height:1.1;letter-spacing:-0.01em}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.skip-link{position:absolute;left:-999px;top:0;z-index:1000;background:var(--brass);color:var(--ink);padding:10px 16px}
.skip-link:focus{left:12px;top:12px}
:focus-visible{outline:2px solid var(--brass-light);outline-offset:3px}

#preloader{position:fixed;inset:0;z-index:999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:transform .9s var(--ease-in-out)}
#preloader.lifted{transform:translateY(-101%)}
.preloader-mark{font-family:var(--font-display);font-size:1.5rem;letter-spacing:.04em;color:var(--ivory)}
.preloader-mark span{color:var(--brass)}
.preloader-bar{width:150px;height:1px;background:var(--line-on-ink);position:relative;overflow:hidden}
.preloader-bar::after{content:"";position:absolute;inset:0;background:var(--brass);transform:translateX(-100%);animation:slide 1.3s var(--ease-in-out) infinite}
@keyframes slide{to{transform:translateX(100%)}}
#scrollProgress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--brass);z-index:120}
.site-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(20,24,31,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-on-ink);transition:transform .45s var(--ease-out)}
.site-nav.nav-hidden{transform:translateY(-100%)}
.site-nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.brand{font-family:var(--font-display);font-size:1.22rem;letter-spacing:.02em;color:var(--ivory)}
.brand-logo{height:30px;width:auto}
.nav-links{display:flex;align-items:center;gap:26px;font-size:.9rem}
.nav-links a{color:rgba(237,230,214,.78);transition:color .2s}
.nav-links a:hover{color:var(--ivory)}
.nav-cta{border:1px solid var(--brass);color:var(--brass-light)!important;padding:9px 18px;border-radius:999px}
.nav-cta:hover{background:var(--brass);color:var(--ink)!important}
.nav-toggle{display:none;background:none;border:0;cursor:pointer;padding:8px;flex-direction:column;gap:5px}
.nav-toggle .bar{display:block;width:22px;height:1.5px;background:var(--ivory);transition:.3s var(--ease-out)}
.nav-toggle.active .bar:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav-toggle.active .bar:nth-child(2){opacity:0}
.nav-toggle.active .bar:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
@media(max-width:900px){
  .nav-toggle{display:flex}
  .nav-links{position:absolute;top:72px;left:0;right:0;flex-direction:column;align-items:flex-start;gap:0;background:var(--ink-soft);border-bottom:1px solid var(--line-on-ink);max-height:0;overflow:hidden;transition:max-height .4s var(--ease-out)}
  .nav-links.open{max-height:420px}
  .nav-links a{padding:15px 28px;width:100%;border-bottom:1px solid rgba(237,230,214,.07)}
  .nav-cta{border:0;border-radius:0;color:var(--brass-light)!important}
}

.breadcrumb-bar{background:var(--ink);padding:120px 0 20px}
.breadcrumb-bar .wrap{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem;color:rgba(237,230,214,.55)}
.breadcrumb-bar a:hover{color:var(--brass-light)}

section{padding:56px 0}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.reveal.is-visible{opacity:1;transform:none}
.eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:12px;display:inline-flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:24px;height:1px;background:var(--teal)}

.gallery-main{aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-light) 60%,var(--brass) 140%);background-size:cover;background-position:center;margin-bottom:12px}
.gallery-thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.gallery-thumbs button{flex:0 0 100px;height:70px;border-radius:2px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;padding:0;background-color:var(--ivory-dim)}
.gallery-thumbs button.active{border-color:var(--brass)}

.detail-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;align-items:start}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
.detail-main h1{font-size:clamp(1.9rem,3.5vw,2.6rem);margin-bottom:10px}
.meta-row{display:flex;flex-wrap:wrap;gap:18px;color:var(--text-muted);font-size:.92rem;margin-bottom:28px}
.meta-row span{display:inline-flex;align-items:center;gap:6px}
.detail-main .desc{color:var(--text-muted);font-size:1.02rem;max-width:65ch;margin-bottom:32px}
.amenity-tags{display:flex;flex-wrap:wrap;gap:10px}
.amenity-tags span{font-size:.82rem;color:var(--teal);background:rgba(47,93,90,.08);padding:8px 16px;border-radius:20px}
h3.section-title{font-size:1.2rem;margin-bottom:16px}

.book-card{background:#fff;border:1px solid rgba(107,99,85,.16);border-radius:var(--radius);padding:28px;position:sticky;top:96px}
.book-card .price{font-family:var(--font-display);font-size:1.8rem;margin-bottom:2px}
.book-card .price small{font-family:var(--font-body);font-size:.8rem;color:var(--text-muted);font-weight:400}
.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-field label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.form-field input,.form-field select{font-size:.92rem;padding:11px 13px;border:1px solid rgba(107,99,85,.25);border-radius:2px;background:#fff}
.form-field input:focus,.form-field select:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:2px;font-size:.92rem;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.25s}
.btn-primary{background:var(--brass);color:var(--ink)}
.btn-primary:hover{background:var(--brass-light)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.avail-note{font-size:.84rem;margin-top:14px;padding:12px 14px;border-radius:2px}
.avail-note.ok{background:rgba(47,93,90,.08);color:var(--teal)}
.avail-note.no{background:rgba(185,60,45,.08);color:#a3392a}

.room-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.room-card{background:#fff;border:1px solid rgba(107,99,85,.14);border-radius:var(--radius);overflow:hidden;transition:transform .25s,box-shadow .25s}
.room-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -20px rgba(20,24,31,.25)}
.room-card-image{height:150px;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-light) 60%,var(--brass) 140%);background-size:cover;background-position:center}
.room-card-body{padding:20px}
.room-card-body h4{font-size:1.05rem;margin-bottom:6px}
.room-card-body .price{font-family:var(--font-display);font-size:1.1rem;color:var(--ink)}

.loading-state,.empty-state,.error-note{padding:60px 0;text-align:center;color:var(--text-muted)}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="preloader" aria-hidden="true">
  <div class="preloader-mark">Uyeh Hotel<span>.</span></div>
  <div class="preloader-bar"></div>
</div>
<div id="scrollProgress"></div>

<nav class="site-nav" id="siteNav">
  <div class="wrap">
    <a href="index.html" class="brand" id="navBrand">Uyeh Hotel</a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="index.html#locations">Locations</a>
      <a href="blog.html">Blog</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="#book" class="nav-cta">Book this room</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
  </div>
</nav>

<main id="main">
<div class="breadcrumb-bar">
  <div class="wrap">
    <a href="index.html">Home</a> <span>/</span>
    <a href="index.html#locations" id="crumbLocations">Locations</a> <span>/</span>
    <a href="#" id="crumbBranch">…</a> <span>/</span>
    <span id="crumbRoom">…</span>
  </div>
</div>

<div id="stateArea"><p class="loading-state">Loading room details…</p></div>

<div id="content" style="display:none;">
  <section class="reveal">
    <div class="wrap">
      <div class="gallery-main" id="galleryMain"></div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>
    </div>
  </section>

  <section class="reveal">
    <div class="wrap detail-grid">
      <div class="detail-main">
        <p class="eyebrow" id="branchEyebrow">—</p>
        <h1 id="roomName">—</h1>
        <div class="meta-row" id="metaRow"></div>
        <p class="desc" id="roomDesc"></p>

        <h3 class="section-title">What's included</h3>
        <div class="amenity-tags" id="amenityTags"></div>
      </div>

      <div class="book-card" id="book">
        <div class="price" id="cardPrice">—</div>
        <form id="availForm">
          <div class="field-row">
            <div class="form-field">
              <label for="checkIn">Check-in</label>
              <input type="date" id="checkIn" required>
            </div>
            <div class="form-field">
              <label for="checkOut">Check-out</label>
              <input type="date" id="checkOut" required>
            </div>
          </div>
          <div class="form-field">
            <label for="guests">Guests</label>
            <select id="guests"></select>
          </div>
          <button type="submit" class="btn btn-primary" id="checkBtn">Check availability</button>
        </form>
        <div id="availResult"></div>
      </div>
    </div>
  </section>

  <section class="reveal">
    <div class="wrap">
      <h3 class="section-title">Other rooms at this location</h3>
      <div class="room-grid" id="otherRooms"></div>
    </div>
  </section>
</div>
</main>

<div id="siteFooter"></div>
<script src="footer.js"></script>

<script>
(function () {
  "use strict";
  const API_BASE = "https://uyeh-hotel-backend.onrender.com/api";
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtMoney = (amount, currency) => {
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency: currency || "USD", maximumFractionDigits: 0 }).format(amount); }
    catch { return `${currency || ""} ${Number(amount).toLocaleString()}`.trim(); }
  };

  async function api(path, options = {}) {
    const res = await fetch(`${API_BASE}${path}`, { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  function initPreloader() {
    const el = $("preloader");
    if (!el || reduced) { if (el) el.style.display = "none"; return; }
    const min = new Promise((r) => setTimeout(r, 600));
    const load = new Promise((r) => (document.readyState === "complete" ? r() : window.addEventListener("load", r, { once: true })));
    Promise.race([Promise.all([min, load]), new Promise((r) => setTimeout(r, 2400))]).then(() => {
      el.classList.add("lifted");
      setTimeout(() => { el.style.display = "none"; }, 950);
    });
  }

  function initNav() {
    const toggle = $("navToggle"), links = $("navLinks"), nav = $("siteNav"), progress = $("scrollProgress");
    toggle.addEventListener("click", () => {
      const open = links.classList.toggle("open");
      toggle.classList.toggle("active", open);
      toggle.setAttribute("aria-expanded", String(open));
    });
    links.addEventListener("click", (e) => { if (e.target.tagName === "A") { links.classList.remove("open"); toggle.classList.remove("active"); } });
    let lastY = window.scrollY, ticking = false;
    function onScroll() {
      const y = window.scrollY;
      const h = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = `${h > 0 ? (y / h) * 100 : 0}%`;
      if (!links.classList.contains("open")) nav.classList.toggle("nav-hidden", y > lastY && y > 160);
      lastY = y; ticking = false;
    }
    window.addEventListener("scroll", () => { if (!ticking) { requestAnimationFrame(onScroll); ticking = true; } }, { passive: true });
  }

  function observe(nodes) {
    if (reduced || !("IntersectionObserver" in window)) { nodes.forEach((n) => n.classList.add("is-visible")); return; }
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add("is-visible"); io.unobserve(en.target); }
    }), { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
    nodes.forEach((n) => io.observe(n));
  }

  const params = new URLSearchParams(window.location.search);
  const branchParam = params.get("branch");
  const roomTypeParam = params.get("roomType");
  let branch = null, roomType = null, otherTypes = [];

  function showError(msg) {
    $("stateArea").innerHTML = `<div class="wrap"><p class="error-note">${esc(msg)} — <a href="index.html#locations" style="text-decoration:underline;">browse locations</a> instead.</p></div>`;
  }

  function renderGallery(images, name) {
    const imgs = (images && images.length) ? images : [null];
    const main = $("galleryMain");
    const setMain = (url) => { main.style.backgroundImage = url ? `url('${url}')` : ""; };
    setMain(imgs[0]);
    $("galleryThumbs").innerHTML = imgs.map((url, i) => `
      <button type="button" class="${i === 0 ? "active" : ""}" data-i="${i}" style="${url ? `background-image:url('${esc(url)}')` : ""}" aria-label="${esc(name)} photo ${i + 1}"></button>
    `).join("");
    $("galleryThumbs").querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        $("galleryThumbs").querySelectorAll("button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        setMain(imgs[Number(btn.dataset.i)]);
      });
    });
  }

  function renderRoom() {
    document.title = `${roomType.name} — ${branch.name}`;
    $("pageDescription").setAttribute("content", `${roomType.name} at ${branch.name}. ${roomType.description || ""}`.trim());

    $("crumbBranch").textContent = branch.name;
    $("crumbBranch").href = `location.html?branch=${esc(branch.slug || branch.id)}`;
    $("crumbRoom").textContent = roomType.name;

    renderGallery(roomType.images, roomType.name);

    $("branchEyebrow").textContent = branch.name;
    $("roomName").textContent = roomType.name;
    $("roomDesc").textContent = roomType.description || "";

    const meta = [
      roomType.sizeSqm ? `${roomType.sizeSqm} m²` : null,
      roomType.bedConfiguration || null,
      `Sleeps ${roomType.maxOccupancy}`,
      roomType.unitCount != null ? `${roomType.unitCount} room${roomType.unitCount === 1 ? "" : "s"} of this type` : null,
    ].filter(Boolean);
    $("metaRow").innerHTML = meta.map((m) => `<span>${esc(m)}</span>`).join("");

    $("amenityTags").innerHTML = (roomType.amenities || []).length
      ? roomType.amenities.map((a) => `<span>${esc(a)}</span>`).join("")
      : `<span style="color:var(--text-muted);background:none;padding:0;">Amenities listed at check-in for this room.</span>`;

    $("cardPrice").innerHTML = `${fmtMoney(roomType.basePrice, roomType.currency)}<small> / night</small>`;

    const guestsSelect = $("guests");
    guestsSelect.innerHTML = Array.from({ length: roomType.maxOccupancy || 2 }, (_, i) => i + 1)
      .map((n) => `<option value="${n}">${n} guest${n === 1 ? "" : "s"}</option>`).join("");

    $("otherRooms").innerHTML = otherTypes.length
      ? otherTypes.map((t) => `
        <a href="room-details.html?branch=${esc(branch.slug || branch.id)}&roomType=${esc(t.id)}" class="room-card">
          <div class="room-card-image"${t.images && t.images[0] ? ` style="background-image:url('${esc(t.images[0])}')"` : ""}></div>
          <div class="room-card-body">
            <h4>${esc(t.name)}</h4>
            <div class="price">${fmtMoney(t.basePrice, t.currency)}<span style="font-family:var(--font-body);font-size:.78rem;color:var(--text-muted);"> / night</span></div>
          </div>
        </a>`).join("")
      : `<p class="empty-state" style="padding:20px 0;">This is the only room type at this location right now.</p>`;

    $("stateArea").style.display = "none";
    $("content").style.display = "block";
    observe([...document.querySelectorAll("section.reveal")]);
  }

  async function hydrateBrand() {
    try {
      const { settings } = await api("/settings");
      const name = settings.platformName || "Uyeh Hotel";
      const navBrand = $("navBrand");
      if (settings.logoUrl) navBrand.innerHTML = `<img class="brand-logo" src="${esc(settings.logoUrl)}" alt="${esc(name)}">`;
      else navBrand.textContent = name;
    } catch { /* fall back to default nav brand already in the markup */ }
  }

  async function load() {
    if (!branchParam || !roomTypeParam) { showError("This room link is missing details"); return; }
    try {
      const [branchRes, typesRes] = await Promise.all([
        api(`/branches/${encodeURIComponent(branchParam)}`),
        api(`/branches/${encodeURIComponent(branchParam)}/room-types`),
      ]);
      branch = branchRes.branch;
      const types = typesRes.roomTypes || [];
      roomType = types.find((t) => t.id === roomTypeParam || t.slug === roomTypeParam);
      if (!roomType) throw new Error("This room type couldn't be found");
      otherTypes = types.filter((t) => t.id !== roomType.id).slice(0, 3);
      renderRoom();
    } catch (err) {
      showError(err.message);
    }
  }

  $("availForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("checkBtn"), out = $("availResult");
    const checkIn = $("checkIn").value, checkOut = $("checkOut").value, guests = $("guests").value;
    btn.disabled = true;
    btn.textContent = "Checking…";
    out.innerHTML = "";
    try {
      const { types } = await api(`/branches/${encodeURIComponent(branch.slug || branch.id)}/type-availability?checkIn=${checkIn}&checkOut=${checkOut}`);
      const match = (types || []).find((t) => t.roomTypeId === roomType.id);
      const sellable = match ? Number(match.sellable) || 0 : 0;
      if (sellable > 0) {
        const bookParams = new URLSearchParams({ branch: branch.slug || branch.id, roomType: roomType.id, checkIn, checkOut, guests });
        out.innerHTML = `<div class="avail-note ok">${sellable} room${sellable === 1 ? "" : "s"} available for those dates. <a href="booking.html?${bookParams.toString()}" style="text-decoration:underline;font-weight:600;">Continue to booking &rarr;</a></div>`;
      } else {
        out.innerHTML = `<div class="avail-note no">Not available for those dates — try different dates or see other rooms below.</div>`;
      }
    } catch (err) {
      out.innerHTML = `<div class="avail-note no">${esc(err.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Check availability";
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    initPreloader();
    initNav();
    hydrateBrand();
    load();
    const today = new Date().toISOString().slice(0, 10);
    $("checkIn").min = today;
    $("checkIn").value = today;
  });
})();
</script>
<script src="/chat-widget.js"></script>
</body>
</html>

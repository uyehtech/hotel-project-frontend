      <td>${b.status === "CHECKED_IN" ? html`<button class="btn btn-sm btn-outline" onclick="openFolioModal('${b.id}')">Check out</button><button class="btn btn-sm btn-outline" onclick="openAssignRoomModal('${b.id}')">Change room</button>`
        : b.status === "CONFIRMED" ? html`<button class="btn btn-sm btn-outline" onclick="openCheckInModal('${b.id}')">Check in</button>`
        : NEXT_STATUS[b.status] ? html`<button class="btn btn-sm btn-outline" onclick="advanceBooking('${b.id}','${NEXT_STATUS[b.status]}')">${NEXT_STATUS[b.status].replace("_", " ").toLowerCase()}</button>` : ""}
      ${["PENDING", "CONFIRMED"].includes(b.status) ? html`<button class="btn btn-sm btn-danger" onclick="advanceBooking('${b.id}','CANCELLED')">Cancel</button>` : ""}</td></tr>`;
    })) : html`<tr><td colspan="5" class="empty-state">${_bk.view === "arrivals" ? "No arrivals expected today." : _bk.view === "inhouse" ? "No guests in-house." : _bk.view === "departures" ? "No departures due today." : "No bookings match."}</td></tr>`;
    const more = document.getElementById("bookingsMore");
    if (more) more.innerHTML = hasMore ? html`<button class="btn btn-outline" onclick="_bk.limit += 100; refreshBookingsTable()">Show more</button>` : "";
  } catch (err) { body.innerHTML = html`<tr><td colspan="5" class="empty-state">${err.message}</td></tr>`; }
}
async function advanceBooking(id, status) {
  if (status === "CANCELLED" && !(await uiConfirm("Cancel this booking? The guest will be told by email.", { title: "Cancel booking", confirmText: "Cancel booking", cancelText: "Keep booking", danger: true }))) return;
  try { await staffApi.updateBookingStatus(id, status); refreshBookingsTable(); }
  catch (err) { showNotice("bookingsNotice", err.message); }
}

/* ---- walk-in booking ---- */
let _wiGuestId = null, _wiRooms = [], _wiTimer = null;
function walkinModalHtml() {
  return html`
    <div class="modal-overlay" id="walkinModal" style="display:none;">
      <div class="modal" style="max-width:560px;">
        <h3>New walk-in booking</h3>
        <div id="walkinNotice"></div>
        <form id="walkinForm">
          <div class="form-field"><label for="wiGuestSearch">Find an existing guest</label><input type="text" id="wiGuestSearch" placeholder="Name, email or phone (3+ letters)" autocomplete="off" oninput="walkinGuestSearch()"><div id="wiGuestResults"></div></div>
          <div id="wiSelectedGuest" style="display:none; margin:0 0 12px; padding:10px 14px; background:var(--ivory); border:1px solid var(--border); border-radius:6px;"><b id="wiSelName"></b> <span id="wiSelEmail" style="color:var(--text-muted); font-size:0.82rem;"></span> <button type="button" class="btn btn-sm btn-outline" onclick="walkinClearGuest()">Change</button></div>
          <div id="wiNewGuest"><p style="font-size:0.8rem; color:var(--text-muted); margin:0 0 8px;">New guest? Enter their details:</p>
            <div class="form-row"><div class="form-field"><label for="wiName">Name</label><input type="text" id="wiName"></div><div class="form-field"><label for="wiEmail">Email</label><input type="email" id="wiEmail"></div></div>
            <div class="form-field"><label for="wiPhone">Phone <span style="color:var(--text-muted); font-weight:400;">(optional)</span></label><input type="text" id="wiPhone"></div></div>
          <div class="form-field"><label for="wiRoom">Room</label><select id="wiRoom" onchange="walkinEstimate()"><option value="">Loading rooms…</option></select></div>
          <div class="form-row"><div class="form-field"><label for="wiIn">Check-in</label><input type="date" id="wiIn" onchange="walkinEstimate()"></div><div class="form-field"><label for="wiOut">Check-out</label><input type="date" id="wiOut" onchange="walkinEstimate()"></div></div>
          <div class="form-row"><div class="form-field"><label for="wiGuests">Guests</label><input type="number" id="wiGuests" min="1" value="1"></div><div class="form-field"><label for="wiReq">Special requests <span style="color:var(--text-muted); font-weight:400;">(optional)</span></label><input type="text" id="wiReq"></div></div>
          <div class="summary-line"><span>Estimated total</span><span id="wiEstimate">—</span></div>
          ${hasPermission("manage_payments") ? html`<div class="form-row" style="margin-top:10px;"><div class="form-field"><label for="wiPay">Payment</label><select id="wiPay" onchange="document.getElementById('wiMethodWrap').style.display = this.value === 'NOW' ? '' : 'none'"><option value="LATER">Pay later (booking stays pending)</option><option value="NOW">Paid now at the desk</option></select></div>
            <div class="form-field" id="wiMethodWrap" style="display:none;"><label for="wiMethod">Method</label><select id="wiMethod"><option value="CASH">Cash</option><option value="CARD">Card</option><option value="TRANSFER">Transfer</option></select></div></div>` : ""}
          <p style="font-size:0.78rem; color:var(--text-muted);">The final price, tax and availability are worked out by the server, exactly as for an online booking.</p>
          <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeWalkinModal()">Cancel</button><button type="submit" class="btn btn-primary" id="wiSubmit">Create booking</button></div>
        </form>
      </div>
    </div>`;
}
async function openWalkinModal() {
  const f = document.getElementById("walkinForm"); f.reset(); walkinClearGuest(); _wiGuestId = null;
  document.getElementById("walkinNotice").innerHTML = ""; document.getElementById("wiGuestResults").innerHTML = "";
  document.getElementById("wiIn").value = todayLocal(); document.getElementById("wiOut").value = todayLocal(1);
  document.getElementById("walkinModal").style.display = "flex";
  const sel = document.getElementById("wiRoom");
  try {
    const { rooms } = await staffApi.listRooms();
    _wiRooms = (rooms || []).filter((r) => !r.status || r.status === "ACTIVE");
    sel.innerHTML = _wiRooms.length ? html.join(_wiRooms.map((r) => html`<option value="${r.id}">${r.name} — ${r.roomNumber} · ${money(r.basePrice, r.currency)}/night</option>`)) : html`<option value="">No rooms available</option>`;
  } catch (err) { sel.innerHTML = html`<option value="">Couldn't load rooms</option>`; }
  walkinEstimate();
}
function closeWalkinModal() { document.getElementById("walkinModal").style.display = "none"; }
function walkinEstimate() {
  const r = _wiRooms.find((x) => x.id === document.getElementById("wiRoom").value);
  const a = document.getElementById("wiIn").value, b = document.getElementById("wiOut").value;
  const nights = a && b ? Math.round((new Date(b) - new Date(a)) / 86400000) : 0;
  document.getElementById("wiEstimate").textContent = r && nights > 0 ? `${money(Number(r.basePrice) * nights, r.currency)} (${nights} night${nights === 1 ? "" : "s"})` : "—";
}
function walkinGuestSearch() {
  clearTimeout(_wiTimer);
  _wiTimer = setTimeout(async () => {
    const q = document.getElementById("wiGuestSearch").value.trim(), el = document.getElementById("wiGuestResults");
    if (q.length < 3) { el.innerHTML = ""; return; }
    try {
      const { guests } = await staffApi.searchGuests(q);
      el.innerHTML = guests.length ? html.join(guests.map((g) => html`<button type="button" class="tray-item" style="border:1px solid var(--border); margin-top:4px; border-radius:6px;" onclick='walkinSelectGuest(${refJs(g)})'><b>${g.name}</b><span>${g.email}${g.phone ? " · " + g.phone : ""}</span></button>`)) : html`<p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">No guest found at this branch — enter their details below.</p>`;
    } catch { /* manual entry still works */ }
  }, 350);
}
function walkinSelectGuest(g) {
  _wiGuestId = g.id;
  document.getElementById("wiSelName").textContent = g.name; document.getElementById("wiSelEmail").textContent = g.email;
  document.getElementById("wiSelectedGuest").style.display = "block"; document.getElementById("wiNewGuest").style.display = "none";
  document.getElementById("wiGuestResults").innerHTML = ""; document.getElementById("wiGuestSearch").value = "";
}
function walkinClearGuest() { _wiGuestId = null; document.getElementById("wiSelectedGuest").style.display = "none"; document.getElementById("wiNewGuest").style.display = "block"; }
async function submitWalkinForm(e) {
  e.preventDefault();
  const v = (id) => document.getElementById(id).value.trim();
  if (!_wiGuestId && (!v("wiName") || !v("wiEmail"))) return showNotice("walkinNotice", "Choose an existing guest, or enter a name and email.");
  if (!v("wiRoom")) return showNotice("walkinNotice", "Choose a room.");
  if (!v("wiIn") || !v("wiOut") || v("wiOut") <= v("wiIn")) return showNotice("walkinNotice", "Check-out must be after check-in.");
  const payload = { roomId: v("wiRoom"), checkIn: v("wiIn"), checkOut: v("wiOut"), guestsCount: Number(v("wiGuests")) || 1, specialRequests: v("wiReq") || undefined };
  if (_wiGuestId) payload.existingGuestId = _wiGuestId; else payload.guest = { name: v("wiName"), email: v("wiEmail"), phone: v("wiPhone") || undefined };
  if (document.getElementById("wiPay") && document.getElementById("wiPay").value === "NOW") payload.payment = { method: document.getElementById("wiMethod").value };
  const btn = document.getElementById("wiSubmit"); btn.disabled = true;
  try {
    const { message, booking } = await staffApi.createWalkInBooking(payload);
    closeWalkinModal();
    _bk.view = "all"; _bk.q = ""; await loadBookingsPage();
    showNotice("bookingsNotice", `${message} Total ${money(booking.totalAmount, booking.currency)}.`, "success");
  } catch (err) { showNotice("walkinNotice", err.message); }
  finally { btn.disabled = false; }
}

/* ============================================================
   VENUE ENQUIRIES (manage_events) — guests asking to rent a hall, garden or restaurant.
   ============================================================ */
const VENUE_STATUS_LIST = ["NEW", "IN_REVIEW", "QUOTED", "ACCEPTED", "DECLINED", "WITHDRAWN"];
let _venueRows = [];
function venueDay(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { timeZone: "UTC", day: "numeric", month: "short", year: "numeric" }) : "—"; }
function venueBadge(v) { return html`<span class="badge badge-${String(v || "").toLowerCase()}">${String(v || "—").replace(/_/g, " ").toLowerCase()}</span>`; }
function openSimpleModal(title, bodyHtml, actionsHtml, width = 560) {
  closeSimpleModal();
  const ov = document.createElement("div"); ov.className = "modal-overlay"; ov.id = "simpleModal";
  ov.innerHTML = html`<div class="modal" style="max-width:${width}px;"><h3>${title}</h3><div id="simpleModalNotice"></div>${bodyHtml}<div class="modal-actions" style="flex-wrap:wrap;">${actionsHtml}</div></div>`;
  document.body.appendChild(ov);
}
function closeSimpleModal() { const el = document.getElementById("simpleModal"); if (el) el.remove(); }
function simpleModalNotice(message, type = "error") { const el = document.getElementById("simpleModalNotice"); if (el) el.innerHTML = html`<div class="notice ${type}" role="alert">${message}</div>`; }
async function loadVenueEnquiriesPage() {
  document.getElementById("pageContent").innerHTML = html`
    ${pageHeader("Venue Enquiries", "Guests asking to rent your halls, gardens or restaurant. Review, send a quote, and confirm.")}
    <div class="stats-grid" id="venueStats"></div>
    <div class="panel">
      <div class="toolbar"><select id="veStatus" aria-label="Filter by status" onchange="venueRefresh()"><option value="">All statuses</option>${html.join(VENUE_STATUS_LIST.map((s) => html`<option value="${s}">${s.replace(/_/g, " ")}</option>`))}</select></div>
      <div id="veNotice"></div>
      <table><thead><tr><th>Reference</th><th>Guest</th><th>Event</th><th>Date</th><th>Guests</th><th>Status</th><th>Quote</th><th></th></tr></thead>
        <tbody id="veBody"><tr><td colspan="8" class="loading-state">Loading…</td></tr></tbody></table>
    </div>`;
  await venueRefresh();
}
async function venueRefresh() {
  const body = document.getElementById("veBody"); if (!body) return;
  try {
    const status = (document.getElementById("veStatus") || {}).value || undefined;
    const { enquiries, counts } = await staffApi.listVenueEnquiries(status);
    _venueRows = enquiries || [];
    const stats = document.getElementById("venueStats");
    if (stats) stats.innerHTML = html.join(["NEW", "IN_REVIEW", "QUOTED", "ACCEPTED"].map((k) => html`<div class="stat-card"><b>${(counts || {})[k] || 0}</b><span>${k.replace("_", " ").toLowerCase()}</span></div>`));
    setNavBadge("venueNavBadge", (counts || {}).NEW || 0);
    body.innerHTML = _venueRows.length ? html.join(_venueRows.map((e) => html`<tr>
      <td><b>${e.reference}</b></td>
      <td>${e.guest?.name || "—"}<br><span style="color:var(--text-muted); font-size:0.78rem;">${e.contactPhone}</span></td>
      <td>${e.eventType}${e.spacePreference ? html`<br><span style="color:var(--text-muted); font-size:0.78rem;">${e.spacePreference}</span>` : ""}</td>
      <td>${venueDay(e.preferredDate)}</td><td>${e.guestsCount}</td><td>${venueBadge(e.status)}</td>
      <td>${e.quoteAmount != null ? money(e.quoteAmount, e.quoteCurrency) : "—"}</td>
      <td><button class="btn btn-sm btn-outline" onclick="venueOpen('${e.id}')">Open</button></td></tr>`)) : html`<tr><td colspan="8" class="empty-state">No venue enquiries yet.</td></tr>`;
  } catch (err) { body.innerHTML = html`<tr><td colspan="8" class="empty-state">${err.message}</td></tr>`; }
}
function venueOpen(id) {
  const e = _venueRows.find((x) => x.id === id); if (!e) return;
  const open = ["NEW", "IN_REVIEW", "QUOTED"].includes(e.status);
  openSimpleModal(`${e.reference} · ${e.eventType}`, html`
    <div class="summary-line"><span>Status</span><span>${venueBadge(e.status)}</span></div>
    <div class="summary-line"><span>Guest</span><span>${e.guest?.name || "—"} · ${e.guest?.email || ""}</span></div>
    <div class="summary-line"><span>Phone / WhatsApp</span><span>${e.contactPhone}</span></div>
    <div class="summary-line"><span>Preferred date</span><span>${venueDay(e.preferredDate)}${e.backupDate ? html` (backup ${venueDay(e.backupDate)})` : ""}</span></div>
    ${e.startTime || e.endTime ? html`<div class="summary-line"><span>Time</span><span>${e.startTime || "?"} – ${e.endTime || "?"}</span></div>` : ""}
    <div class="summary-line"><span>Expected guests</span><span>${e.guestsCount}</span></div>
    ${e.spacePreference ? html`<div class="summary-line"><span>Space</span><span>${e.spacePreference}</span></div>` : ""}
    ${(e.services || []).length ? html`<div class="summary-line"><span>Wants</span><span>${e.services.join(", ")}</span></div>` : ""}
    ${e.budget ? html`<div class="summary-line"><span>Budget</span><span>${e.budget}</span></div>` : ""}
    ${e.notes ? html`<div class="form-field" style="margin-top:12px;"><label>Guest notes</label><div style="white-space:pre-wrap;">${e.notes}</div></div>` : ""}
    ${e.status === "DECLINED" && e.declineReason ? html`<div class="summary-line"><span>Decline reason</span><span>${e.declineReason}</span></div>` : ""}
    ${e.quoteAmount != null ? html`<div class="summary-line"><span>Quote</span><span><b>${money(e.quoteAmount, e.quoteCurrency)}</b>${e.quoteValidUntil ? html` · valid until ${venueDay(e.quoteValidUntil)}` : ""}</span></div>` : ""}
    <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">
    ${open ? html`
      <div class="form-row"><div class="form-field"><label for="veQuote">Quote amount</label><input type="number" id="veQuote" min="0" step="0.01" value="${e.quoteAmount ?? ""}" placeholder="e.g. 2500000"></div>
        <div class="form-field"><label for="veCur">Currency</label><input type="text" id="veCur" maxlength="3" value="${e.quoteCurrency || ""}" placeholder="branch default" style="text-transform:uppercase;"></div></div>
      <div class="form-field"><label for="veValid">Quote valid until</label><input type="date" id="veValid" value="${e.quoteValidUntil ? String(e.quoteValidUntil).slice(0, 10) : ""}"></div>
      <div class="form-field"><label for="veQNotes">What the quote includes <span style="color:var(--text-muted); font-weight:400;">(shown to the guest)</span></label><textarea id="veQNotes" rows="2">${e.quoteNotes || ""}</textarea></div>
      <div class="form-field"><label for="veReason">Reason if declining <span style="color:var(--text-muted); font-weight:400;">(shown to the guest)</span></label><input type="text" id="veReason" maxlength="500"></div>` : ""}
    <div class="form-field"><label for="veNote">Internal notes <span style="color:var(--text-muted); font-weight:400;">(never shown to the guest)</span></label><textarea id="veNote" rows="2">${e.internalNotes || ""}</textarea></div>
    ${e.handledByName ? html`<p style="font-size:0.8rem; color:var(--text-muted);">Last handled by ${e.handledByName}.</p>` : ""}`,
    html`<button class="btn btn-outline" onclick="closeSimpleModal()">Close</button>
      ${hasPermission("handle_tickets") ? html`<button class="btn btn-outline" onclick="closeSimpleModal(); switchPage('tickets');" title="Reply in the Support thread titled ${e.reference}">Open conversation</button>` : ""}
      <button class="btn btn-outline" onclick="venueAct('${e.id}', null)">Save notes</button>
      ${open ? html`${e.status === "NEW" ? html`<button class="btn btn-outline" onclick="venueAct('${e.id}', 'IN_REVIEW')">Mark in review</button>` : ""}
        <button class="btn btn-danger" onclick="venueAct('${e.id}', 'DECLINED')">Decline</button>
        <button class="btn btn-outline" onclick="venueAct('${e.id}', 'ACCEPTED')" title="Use when the guest confirmed outside the app">Confirm booking</button>
        <button class="btn btn-primary" onclick="venueAct('${e.id}', 'QUOTED')">Send quote</button>` : ""}`, 780);
}
async function venueAct(id, status) {
  const val = (x) => { const el = document.getElementById(x); return el ? el.value.trim() : ""; };
  const payload = { internalNotes: val("veNote") };
  if (status) {
    payload.status = status;
    if (status === "QUOTED") {
      const amt = Number(val("veQuote"));
      if (!(amt > 0)) return simpleModalNotice("Enter the quote amount first.");
      payload.quoteAmount = amt; payload.quoteNotes = val("veQNotes");
      if (val("veCur")) payload.quoteCurrency = val("veCur").toUpperCase();
      if (val("veValid")) payload.quoteValidUntil = val("veValid");
    }
    if (status === "DECLINED") {
      if (val("veReason").length < 3 && !(await uiConfirm("Decline without a reason? The guest will not be told why.", { title: "Decline enquiry", confirmText: "Decline", danger: true }))) return;
      payload.declineReason = val("veReason");
    }
  }
  try {
    await staffApi.updateVenueEnquiry(id, payload);
    closeSimpleModal(); await venueRefresh();
    showNotice("veNotice", status ? "Saved. The guest has been notified." : "Notes saved.", "success");
  } catch (err) { simpleModalNotice(err.message); }
}

  const bell = document.getElementById("bellBtn"); if (bell && !bell.dataset.ready) { bell.dataset.ready = "1"; bell.addEventListener("click", toggleTray); }
  initGlobalSearch(); renderBell(); syncOnline(); queueA11y();
}

// Boot
if (getToken() && getStaff()) { showApp(); } else { showLogin(); }

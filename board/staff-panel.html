<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Panel — Uyeh Hotel</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.0/socket.io.min.js"></script>
<script src="../config.js"></script>
<script src="../web-core.js"></script>
<style>
/* ============================================================
   Uyeh HOTEL — STAFF PANEL
   Most restricted tier. Same design tokens as Director/Manager
   dashboards. No staff management, no settings — a Staff account
   only ever gets the operational sections a Manager granted them
   via checkbox permissions at account creation. Single-file SPA.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #14181f; --ink-light: #1c2230; --ivory: #f6f1e7; --panel: #ffffff;
  --border: #e6e0d2; --border-soft: rgba(20,24,31,0.08);
  --brass: #b98d45; --brass-dark: #96712f; --teal: #2f5d5a; --danger: #a3392a; --info: #3b6ea5;
  --text-muted: #6b6355; --text-on-dark: #ede6d6; --text-on-dark-muted: rgba(237,230,214,0.6);
  --font-display: 'Fraunces', serif; --font-body: 'Inter', -apple-system, sans-serif; --radius: 8px;
}

body { font-family: var(--font-body); background: var(--ivory); color: var(--ink); overflow-x: hidden; font-size: 14px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
a { color: inherit; }

/* LOGIN */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ink); }
.login-card { background: var(--panel); padding: 48px 40px; border-radius: var(--radius); width: 100%; max-width: 380px; }
.login-card .brand { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 6px; }
.login-card .brand span { color: var(--brass); }
.login-card p.sub { color: var(--text-muted); margin-bottom: 28px; font-size: 0.88rem; }

/* SIDEBAR */
.sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 270px; background: var(--ink);
  border-right: 1px solid rgba(237,230,214,0.08); padding: 26px 0; z-index: 1000; overflow-y: auto; transition: transform 0.3s ease; }
.sidebar-header { padding: 0 26px 22px; border-bottom: 1px solid rgba(237,230,214,0.08); display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--brass-dark), var(--brass));
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 1.1rem; }
.logo-text { font-family: var(--font-display); font-size: 1.2rem; color: var(--text-on-dark); }
.logo-text span { color: var(--brass); }

.admin-info { padding: 18px 26px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(237,230,214,0.08); }
.admin-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), #3d7873);
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 0.95rem; flex-shrink: 0; }
.admin-details .admin-name { color: var(--text-on-dark); font-size: 0.88rem; font-weight: 600; }
.admin-details .admin-role { color: var(--brass); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }
.admin-details .admin-branch { color: var(--text-on-dark-muted); font-size: 0.74rem; margin-top: 1px; }

.nav-menu { padding: 14px 0; }
.nav-item-standalone { padding: 11px 26px; display: flex; align-items: center; gap: 12px; color: var(--text-on-dark-muted);
  cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; font-size: 0.88rem; font-weight: 500; }
.nav-item-standalone:hover { background: rgba(185,141,69,0.06); color: var(--text-on-dark); }
.nav-item-standalone.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item-standalone i { width: 18px; text-align: center; }
.nav-divider { height: 1px; background: rgba(237,230,214,0.08); margin: 10px 26px 10px; }

.nav-group { margin-bottom: 2px; }
.nav-group-header { padding: 10px 26px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; transition: all 0.15s; }
.nav-group-header:hover { background: rgba(255,255,255,0.02); }
.nav-group-header .group-icon { width: 18px; text-align: center; font-size: 0.85rem; color: rgba(185,141,69,0.6); }
.nav-group-header .group-label { flex: 1; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted); }
.nav-group-header .group-chevron { font-size: 0.65rem; color: rgba(237,230,214,0.25); transition: transform 0.2s; }
.nav-group.open > .nav-group-header .group-chevron { transform: rotate(180deg); color: var(--brass); }
.nav-group.open > .nav-group-header .group-icon, .nav-group.open > .nav-group-header .group-label { color: var(--brass); }
.nav-group-header .group-badge { font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: rgba(163,57,42,0.25); color: #e08a7a; display: none; }
.nav-group-header .group-badge.visible { display: inline-block; }
.nav-group-body { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
.nav-group.open > .nav-group-body { max-height: 600px; }

.nav-item { padding: 10px 26px 10px 50px; display: flex; align-items: center; gap: 11px; color: var(--text-on-dark-muted);
  cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; font-size: 0.84rem; font-weight: 500; position: relative; }
.nav-item:hover { background: rgba(185,141,69,0.05); color: var(--text-on-dark); }
.nav-item.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item i { width: 16px; text-align: center; font-size: 0.82rem; }
.nav-item .nav-badge { margin-left: auto; background: rgba(163,57,42,0.25); color: #e08a7a; padding: 1px 7px; border-radius: 9px; font-size: 0.64rem; font-weight: 700; display: none; }
.nav-item .nav-badge.visible { display: inline-block; }

.sidebar-footer { padding: 16px 26px 0; margin-top: 12px; }
.logout-link { color: var(--text-on-dark-muted); font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.logout-link:hover { color: var(--text-on-dark); }

/* MAIN */
.main-content { margin-left: 270px; min-height: 100vh; }
.topbar { background: rgba(246,241,231,0.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 16px 36px;
  display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 16px; }
.hamburger-btn { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
.hamburger-btn span { width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }
.search-bar { flex: 1; max-width: 420px; position: relative; }
.search-bar input { width: 100%; padding: 10px 16px 10px 40px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.88rem; font-family: var(--font-body); }
.search-bar input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
.search-bar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }
.topbar-actions { display: flex; align-items: center; gap: 14px; }
.topbar-btn { width: 40px; height: 40px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--ink); }

.page-content { padding: 30px 36px 60px; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-title { font-size: 1.5rem; }
.page-subtitle { color: var(--text-muted); font-size: 0.88rem; margin-top: 4px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.stat-card b { font-family: var(--font-display); font-size: 1.6rem; display: block; }
.stat-card span { color: var(--text-muted); font-size: 0.8rem; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }
.panel h3 { font-size: 1.05rem; margin-bottom: 14px; }

table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
tr:last-child td { border-bottom: none; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; text-transform: capitalize; }
.badge-active, .badge-paid, .badge-confirmed, .badge-checked_in, .badge-resolved, .badge-available { background: rgba(47,93,90,0.12); color: var(--teal); }
.badge-inactive, .badge-cancelled, .badge-refunded { background: rgba(163,57,42,0.1); color: var(--danger); }
.badge-pending, .badge-open, .badge-maintenance { background: rgba(179,140,43,0.14); color: var(--brass-dark); }
.badge-in_progress, .badge-cleaning, .badge-occupied { background: rgba(59,110,165,0.12); color: var(--info); }

.btn { font-family: var(--font-body); font-size: 0.84rem; font-weight: 600; padding: 10px 18px; border-radius: var(--radius); border: none; cursor: pointer; transition: opacity 0.15s; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--brass); color: var(--ink); }
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink); }
.btn-outline:hover:not(:disabled) { background: var(--ivory); }
.btn-danger { background: rgba(163,57,42,0.1); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: rgba(163,57,42,0.18); }
.btn-sm { padding: 6px 12px; font-size: 0.78rem; margin-right: 6px; }

.loading-state, .empty-state { text-align: center; color: var(--text-muted); padding: 30px; font-size: 0.86rem; }
.coming-soon { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.coming-soon i { font-size: 2rem; color: var(--brass); margin-bottom: 12px; display: block; }

.notice { padding: 12px 16px; border-radius: var(--radius); font-size: 0.84rem; margin-bottom: 14px; }
.notice.error { background: rgba(163,57,42,0.08); color: var(--danger); border: 1px solid rgba(163,57,42,0.2); }
.notice.success { background: rgba(47,93,90,0.08); color: var(--teal); border: 1px solid rgba(47,93,90,0.2); }
.notice.info { background: rgba(31,41,55,0.06); color: var(--text, #1F2937); border: 1px solid rgba(31,41,55,0.15); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
.form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font-body); font-size: 0.86rem; background: #fff; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,24,31,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.modal { background: var(--panel); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.locked-note { display: flex; align-items: flex-start; gap: 10px; background: rgba(59,110,165,0.06); border: 1px solid rgba(59,110,165,0.18);
  border-radius: var(--radius); padding: 12px 16px; font-size: 0.82rem; color: var(--info); margin-bottom: 18px; }
.locked-note i { margin-top: 2px; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .hamburger-btn { display: flex; }
  .form-row { grid-template-columns: 1fr; }
}

/* ===== PATCH14-STAFF-PANEL ===== */
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip-link { position:absolute; left:-9999px; top:8px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:var(--radius); z-index:5000; font-size:0.86rem; }
.skip-link:focus { left:12px; }
:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }
.nav-item:focus-visible, .nav-item-standalone:focus-visible, .nav-group-header:focus-visible, .logout-link:focus-visible { outline-offset:-2px; }
.nav-group:not(.open) > .nav-group-body { visibility:hidden; }
.page-content:focus { outline:none; }
button.topbar-btn { font:inherit; padding:0; }
.panel { overflow-x:auto; }
td .btn + .btn { margin-left:0; }
.badge-awaiting_inspection { background:rgba(59,110,165,0.12); color:var(--info); }
.badge-clean, .badge-inspected { background:rgba(47,93,90,0.12); color:var(--teal); }
.badge-dirty, .badge-out_of_order, .badge-urgent, .badge-high { background:rgba(163,57,42,0.1); color:var(--danger); }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
.toolbar select, .toolbar input[type=search] { padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius); font:inherit; font-size:0.84rem; background:#fff; }
.toolbar input[type=search] { flex:1; min-width:180px; max-width:320px; }
.pills { display:flex; flex-wrap:wrap; gap:6px; }
.pill { font:inherit; font-size:0.8rem; font-weight:600; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--ink); cursor:pointer; }
.pill[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
.row-late td { background:rgba(163,57,42,0.05); }
.late-text { color:var(--danger); font-weight:700; }
.link-btn { background:none; border:none; color:var(--brass-dark); font:inherit; font-size:0.78rem; font-weight:600; cursor:pointer; text-decoration:underline; }
#bellWrap { position:relative; }
.tray { position:absolute; right:0; top:48px; width:min(360px, 92vw); max-height:70vh; overflow-y:auto; background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 12px 32px rgba(0,0,0,0.18); z-index:300; }
.tray[hidden], .search-results[hidden], .offline-banner[hidden] { display:none; }
.tray-head { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); }
.tray-item { display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; padding:10px 16px; background:none; border:none; border-bottom:1px solid var(--border-soft); font:inherit; font-size:0.84rem; cursor:pointer; color:var(--ink); }
.tray-item:hover, .tray-item:focus-visible { background:var(--ivory); }
.tray-item.unread { background:rgba(185,141,69,0.08); }
.tray-item span { color:var(--text-muted); font-size:0.8rem; }
.tray-item small { color:var(--text-muted); font-size:0.72rem; }
.search-results { position:absolute; left:0; right:0; top:46px; background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 12px 32px rgba(0,0,0,0.18); z-index:300; max-height:60vh; overflow-y:auto; }
.offline-banner { position:sticky; top:0; z-index:400; background:var(--danger); color:#fff; text-align:center; padding:8px 12px; font-size:0.84rem; font-weight:600; }
@media (max-width:700px) {
  .page-content { padding:20px 16px 50px; }
  .topbar { padding:12px 16px; }
  .panel { padding:16px; }
  .panel table { min-width:620px; }
  .modal { padding:20px; }
  .modal-actions { flex-wrap:wrap; }
  .form-row { grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand">Uyeh <span>Hotel</span></div>
    <p class="sub">Staff panel — sign in with your staff account.</p>
    <div id="loginNotice"></div>
    <form id="loginForm">
      <div class="form-field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="form-field"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:6px;">Log in</button>
    </form>

    <form id="twoFactorForm" style="display:none;">
      <p class="sub" style="margin-top:0;">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div class="form-field"><label>Code</label><input type="text" id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required autofocus></div>
      <button type="submit" class="btn btn-primary" id="twoFactorBtn" style="width:100%; margin-top:6px;">Verify</button>
      <button type="button" id="twoFactorBackBtn" style="width:100%; margin-top:10px; background:none; border:none; color:var(--text-muted); font-size:0.85rem; cursor:pointer;">&larr; Back to login</button>
    </form>
  </div>
</div>

<div id="appShell" style="display:none;">
  <a class="skip-link" href="#pageContent">Skip to content</a>
  <div class="offline-banner" id="offlineBanner" role="status" hidden>You are offline. Changes will not save until the connection is back.</div>
  <div class="sidebar" id="sidebar" role="navigation" aria-label="Main">
    <div class="sidebar-header">
      <div class="logo-icon">O</div>
      <div class="logo-text">Uyeh <span>Hotel</span></div>
    </div>
    <div class="admin-info" id="adminInfoBlock" onclick="openSecurityModal()" style="cursor:pointer;" title="Account & security">
      <div class="admin-avatar" id="adminAvatar">S</div>
      <div class="admin-details">
        <div class="admin-name" id="adminName"></div>
        <div class="admin-role" id="adminRole"></div>
        <div class="admin-branch" id="adminBranch"></div>
      </div>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="sidebar-footer">
      <div class="logout-link" id="logoutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Log out</div>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="search-bar" id="globalSearchBar" role="search"><i class="fas fa-magnifying-glass" aria-hidden="true"></i><input type="search" id="globalSearch" placeholder="Find a guest or booking…" aria-label="Find a guest or booking" autocomplete="off"><div class="search-results" id="globalSearchResults" hidden></div></div>
      <div class="topbar-actions">
        <div id="bellWrap"><button type="button" class="topbar-btn" id="bellBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" aria-controls="bellTray"><i class="fas fa-bell" aria-hidden="true"></i><span class="nav-badge" id="bellBadge" aria-hidden="true" style="position:absolute; top:2px; right:2px; display:none;">0</span></button><div class="tray" id="bellTray" hidden></div></div>
        <button type="button" class="topbar-btn" id="pushToggleBtn" title="Push notifications" aria-label="Turn push notifications on or off" onclick="handlePushToggle()"><i class="fas fa-bell-slash" id="pushToggleIcon" aria-hidden="true"></i></button>
      </div>
    </div>
    <main class="page-content" id="pageContent" tabindex="-1"></main>
  </div>
</div>

<script>
/* ============================================================
   SAFE HTML (F2) — every ${} inside an html`...` template is escaped for
   the exact place it lands: element text, a normal attribute, a URL
   attribute (scheme allow-list), a style attribute, or inside a
   quoted JavaScript string of an on*="" handler. Nothing the server
   (or another guest) wrote can break out of its slot.
     html`...`      -> SafeHtml (assign to .innerHTML directly)
     raw(str)       -> trusted markup, inserted as-is
     html.join(arr) -> SafeHtml of an array of items ("" when empty)
     refJs(obj)     -> JS expression for onclick that hands `obj` back
   ============================================================ */
class SafeHtml { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = (s) => new SafeHtml(String(s == null ? "" : s));
const _ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const escHtml = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => _ESC[c]);
const _jsStr = (v) => String(v == null ? "" : v).replace(/[\\'"<>&\u0000-\u001f\u2028\u2029`$]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
const _URL_ATTRS = new Set(["href", "src", "action", "formaction", "poster", "cite", "data", "xlink:href"]);
function _safeUrl(v, tag, attr) {
  const s = String(v == null ? "" : v).trim();
  const probe = s.replace(/[\u0000-  ]/g, "");
  if (!/^[a-z][a-z0-9+.\-]*:/i.test(probe)) return s; // relative, #, ?, //host
  if (/^(https?:|mailto:|tel:)/i.test(probe)) return s;

/** Leaves this account for good: tells the server to revoke the renewal token, drops the live socket, shows the login. */
function endSession(message) {
  const rt = getRefreshToken();
  if (rt) fetch(`${API_BASE}/auth/logout`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refreshToken: rt }), keepalive: true }).catch(() => {});

/* Floating toast — showNotice() only targets a container already
 * on-screen, which doesn't help for something that arrives on any page. */
function toast(message, type = "info") {
  let stack = document.getElementById("toastStack");
  if (!stack) {
    stack = document.createElement("div");
    stack.id = "toastStack";
    stack.setAttribute("role", "status"); stack.setAttribute("aria-live", "polite");
    stack.style.cssText = "position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px;";
    document.body.appendChild(stack);
  }
  const el = document.createElement("div");
  const bg = type === "error" ? "#B3261E" : type === "success" ? "#2E5339" : "#1F2937";
  el.style.cssText = `background:${bg}; color:#fff; padding:12px 16px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.2); max-width:320px; font-size:0.9rem; cursor:pointer;`;
  el.textContent = message;
  el.title = "Click to dismiss";
  el.onclick = () => el.remove();
  stack.appendChild(el);
  while (stack.children.length > 4) stack.firstChild.remove();
  setTimeout(() => el.remove(), type === "error" ? 9000 : 5000);
}

let _staffSocket = null;

  if (_staffSocket || typeof io !== "function") return; // live updates are a bonus: the panel must still work if the socket script was blocked
  _staffSocket = io(API_BASE.replace(/\/api$/, ""), { auth: (cb) => cb({ token: getToken() }) }); // fresh token on every (re)connect
  let _renewedOnce = false;
  _staffSocket.on("connect_error", async () => { // an expired token: renew once, then let it retry with the new one
    if (_renewedOnce) return; _renewedOnce = true;
    if ((await refreshSession()) === false) endSession("Your session ended. Please sign in again.");
  });
  _staffSocket.on("connect", () => { _renewedOnce = false; });
  _staffSocket.on("notification", (n) => onStaffNotification(n, "general"));

function urlBase64ToUint8Array(base64String) {

  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  const reg = await navigator.serviceWorker.getRegistration("sw-staff.js").catch(() => null);

  const sub = await reg.pushManager.getSubscription();

async function subscribeToPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    throw new Error("Push notifications aren't supported on this browser");
  }
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("Notification permission was not granted");

  const reg = await navigator.serviceWorker.register("sw-staff.js");
  const { publicKey } = await staffApi.getPushVapidKey();
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(publicKey),

  await staffApi.subscribeToPush(sub.toJSON());
  return true;
}

  const reg = await navigator.serviceWorker.getRegistration("sw-staff.js").catch(() => null);
  if (!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await staffApi.unsubscribeFromPush(sub.endpoint).catch(() => {});
  await sub.unsubscribe();

  try {
    const on = await isPushSubscribed();
    if (on) { await unsubscribeFromPush(); toast("Push notifications turned off.", "success"); }

    toast(err.message, "error");

}

    if (ok) return adminRequest(path, options, true);
    if (ok === false) { endSession("Your session ended. Please sign in again."); throw new ApiError("Session expired", 401); }

function renderSidebar() {
  const staff = getStaff();
  if (!staff) return;

  document.getElementById("adminAvatar").textContent = staff.name.charAt(0).toUpperCase();
  document.getElementById("adminName").textContent = staff.name;
  document.getElementById("adminRole").textContent = staff.title || "Staff";
  document.getElementById("adminBranch").textContent = staff.branchName || "";

  const groupsHtml = html.join(NAV_GROUPS.map((group) => {
    const visibleItems = group.items.filter((item) => item.permissions
      ? item.permissions.some((p) => (staff.permissions || []).includes(p))
      : (staff.permissions || []).includes(item.permission));
    if (!visibleItems.length) return "";
    return html`
      <div class="nav-group open" data-group="${group.id}">
        <div class="nav-group-header" onclick="toggleNavGroup(this)">
          <i class="fas ${group.icon} group-icon"></i>
          <span class="group-label">${group.label}</span>
          <i class="fas fa-chevron-down group-chevron"></i>
        </div>
        <div class="nav-group-body">
          ${html.join(visibleItems.map((item) => html`
            <div class="nav-item" data-page="${item.page}" onclick="switchPage('${item.page}')">
              <i class="fas ${item.icon}"></i><span>${item.label}</span>
              ${item.badgeId ? html`<span class="nav-badge" id="${item.badgeId}">0</span>` : ""}
            </div>
          `))}
        </div>
      </div>
    `;
  }));

  document.getElementById("navMenu").innerHTML = html`
    <div class="nav-item-standalone active" data-page="dashboard" onclick="switchPage('dashboard')">
      <i class="fas fa-house"></i><span>Dashboard</span>
    </div>
    <div class="nav-item-standalone" data-page="my-shift" onclick="switchPage('my-shift')">
      <i class="fas fa-clock"></i><span>My Shift</span>
    </div>
    <div class="nav-divider"></div>
    ${groupsHtml}
  `;
  enhanceNav();
}
function toggleNavGroup(headerEl) { headerEl.parentElement.classList.toggle("open"); headerEl.setAttribute("aria-expanded", String(headerEl.parentElement.classList.contains("open"))); }
function setActiveNav(page) { document.querySelectorAll(".nav-item, .nav-item-standalone").forEach((el) => { const on = el.getAttribute("data-page") === page; el.classList.toggle("active", on); if (on) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current"); }); }

/* ============================================================
   ROUTER
   ============================================================ */
const PAGE_LOADERS = {
  dashboard: loadDashboardPage,
  "my-shift": loadMyShiftPage,
  rooms: loadRoomsPage,
  housekeeping: loadHousekeepingPage,
  menu: loadMenuPage,
  "place-order": loadPlaceOrderPage,
  orders: loadOrdersQueuePage,
  bookings: loadBookingsPage,
  stock: loadStockPage,
  events: loadEventsPage,
  "venue-enquiries": loadVenueEnquiriesPage,
  tickets: loadTicketsPage,
  reports: loadReportsPage,
};

function switchPage(page) {
  const staff = getStaff();
  setActiveNav(page);
  const container = document.getElementById("pageContent");

  // Belt-and-suspenders: even though the nav only ever renders links this
  // account has permission for, a direct switchPage() call (or a stale
  // link) still gets blocked here rather than trusting the click alone.
  const pagePermission = { rooms: "manage_rooms", menu: "manage_menu", bookings: "manage_bookings",
    stock: "manage_stock", events: "manage_events", tickets: "handle_tickets", reports: "view_reports",
    "venue-enquiries": "manage_events" }[page];
  const pageAnyPermissions = { "place-order": ["manage_menu", "manage_laundry", "manage_spa"], orders: ORDER_VIEW_PERMS }[page];
  if (pagePermission && !hasPermission(pagePermission)) {
    container.innerHTML = html`<div class="empty-state">You don't have access to this section. Ask your Manager to grant it.</div>`;
    return;
  }
  if (pageAnyPermissions && !pageAnyPermissions.some((p) => hasPermission(p))) {
    container.innerHTML = html`<div class="empty-state">You don't have access to this section. Ask your Manager to grant it.</div>`;
    return;
  }

  const loader = PAGE_LOADERS[page];
  if (!loader) { container.innerHTML = html`<div class="empty-state">Unknown page.</div>`; return; }
  container.innerHTML = html`<div class="loading-state">Loading…</div>`;
  loader();
  afterPageSwitch(page);
  if (window.innerWidth <= 900) closeSidebarMobile();
}
function loadComingSoon(title, description) {
  document.getElementById("pageContent").innerHTML = html`
    <div class="page-header"><div><h1 class="page-title">${title}</h1></div></div>
    <div class="panel"><div class="coming-soon"><i class="fas fa-hammer"></i><p><b>${title} isn't built yet.</b></p><p style="margin-top:6px;">${description}</p></div></div>
  `;
}
function pageHeader(title, subtitle, actionHtml = "") {
  return html`<div class="page-header"><div><h1 class="page-title">${title}</h1>${subtitle ? html`<p class="page-subtitle">${subtitle}</p>` : ""}</div>${actionHtml}</div>`;
}

/* ============================================================
   DASHBOARD — this branch, no staff-count card (staff can't see
   the staff list here at all, unlike the Manager panel)
   ============================================================ */
async function loadDashboardPage() {
  const staff = getStaff();
  const container = document.getElementById("pageContent");
  const cards = [];
  let bookingsPanel = "", ticketsPanel = "";

  try {
    if (hasPermission("manage_bookings")) {
      const { bookings } = await staffApi.listBookings();
      const upcoming = bookings.filter((b) => ["PENDING", "CONFIRMED"].includes(b.status));
      cards.push({ label: "Upcoming bookings", value: upcoming.length });
      if (bookings.length) {
        bookingsPanel = html`
          <div class="panel"><h3>Recent bookings</h3>
            <table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th></tr></thead>
              <tbody>${html.join(bookings.slice(0, 6).map((b) => html`
                <tr><td>${b.guest.name}</td><td>${b.room ? `${b.room.name} — ${b.room.roomNumber}` : html`<span style="color:var(--text-muted);">Not assigned</span>`}</td>
                <td>${b.checkIn.slice(0,10)} → ${b.checkOut.slice(0,10)}</td>
                <td><span class="badge badge-${b.status.toLowerCase()}">${b.status}</span></td></tr>
              `))}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_rooms")) {
      const { rooms } = await staffApi.listRooms();
      cards.push({ label: "Total rooms", value: rooms.length });
    }
    if (hasPermission("handle_tickets")) {
      const { tickets } = await staffApi.listTickets("OPEN");
      cards.push({ label: "Open tickets", value: tickets.length });
      if (tickets.length) {
        ticketsPanel = html`
          <div class="panel"><h3>Open guest tickets</h3>
            <table><thead><tr><th>Subject</th><th>Guest</th><th>Priority</th><th>Status</th></tr></thead>
              <tbody>${html.join(tickets.slice(0, 6).map((t) => html`
                <tr><td>${t.subject}</td><td>${t.guest.name}</td><td>${t.priority}</td>
                <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td></tr>
              `))}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_payments")) {
      const { totals, totalsCurrency } = await staffApi.listTransactions();
      cards.push({ label: "Recorded this month", value: money(totals?.paid || 0, totalsCurrency) });
    }

    container.innerHTML = html`
      ${pageHeader("Overview", staff.branchName ? `What's happening at ${staff.branchName} right now.` : "A quick look at what's happening right now.")}
      <div class="stats-grid">
        ${cards.length ? html.join(cards.map((c) => html`<div class="stat-card"><b>${c.value}</b><span>${c.label}</span></div>`))
          : html`<div class="empty-state">Your account doesn't have access to any dashboard sections yet — ask your Manager to grant permissions.</div>`}
      </div>
      ${bookingsPanel}${ticketsPanel}
    `;
  } catch (err) {
    container.innerHTML = html`${pageHeader("Overview")}<div class="empty-state">Couldn't load your overview (${err.message}).</div>`;
  }
}

  } catch (err) { showNotice("myShiftNotice", err.message); }

async function clockInShift(id) {
  try { await staffApi.clockIn(id); showNotice("myShiftNotice", "Clocked in.", "success"); refreshMyShifts(); }
  catch (err) { showNotice("myShiftNotice", err.message); }
}
async function clockOutShift(id) {
  try { await staffApi.clockOut(id); showNotice("myShiftNotice", "Clocked out.", "success"); refreshMyShifts(); }
  catch (err) { showNotice("myShiftNotice", err.message); }
}

async function refreshMyTasks() {
  try {
    const { tasks } = await staffApi.getMyTasks();
    const canManage = hasPermission("manage_rooms");
    const NEXT = { PENDING: "IN_PROGRESS", ASSIGNED: "IN_PROGRESS", IN_PROGRESS: canManage ? "COMPLETED" : "AWAITING_INSPECTION" };
    const LABEL = { IN_PROGRESS: "Start", COMPLETED: "Complete", AWAITING_INSPECTION: "Ready for inspection" };
    document.getElementById("myTasksBody").innerHTML = tasks.length ? html.join(tasks.map((t) => html`
      <tr>
        <td>${t.room ? t.room.roomNumber : "—"}</td>
        <td>${t.type.replace(/_/g, " ")}</td>
        <td><span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span></td>
        <td><span class="badge badge-${t.status.toLowerCase()}">${t.status.replace(/_/g, " ")}</span></td>
        <td>${NEXT[t.status] ? html`<button class="btn btn-sm btn-outline" onclick="advanceMyTask('${t.id}','${NEXT[t.status]}')">${LABEL[NEXT[t.status]]}</button>`
          : t.status === "AWAITING_INSPECTION" ? html`<span style="color:var(--text-muted); font-size:0.8rem;">Waiting for an inspector</span>` : ""}</td>
      </tr>
    `)) : html`<tr><td colspan="5" class="empty-state">No tasks assigned to you.</td></tr>`;
  } catch (err) { showNotice("myShiftNotice", err.message); }
}
async function advanceMyTask(id, status) {
  try {
    // Completing is a supervisor action (manage_rooms); everyone else starts a task and sends it for inspection.
    if (status === "COMPLETED") await staffApi.updateHousekeepingTask(id, { status }); else await staffApi.updateMyTask(id, { status });
    showNotice("myShiftNotice", status === "AWAITING_INSPECTION" ? "Sent for inspection." : "Task updated.", "success");
    refreshMyTasks();
  } catch (err) { showNotice("myShiftNotice", err.message); }
}

  try {
    const { summary, rooms } = await staffApi.getHousekeepingBoard();
    document.getElementById("hkBoardStats").innerHTML = html`
      <div class="stat-card"><b>${summary.openTasks}</b><span>Open tasks</span></div>
      <div class="stat-card"><b>${summary.openWorkOrders}</b><span>Open issues</span></div>

      <div class="stat-card"><b>${summary.outOfOrder}</b><span>Out of order</span></div>

    const TASK_NEXT = { PENDING: "IN_PROGRESS", ASSIGNED: "IN_PROGRESS", IN_PROGRESS: "COMPLETED", AWAITING_INSPECTION: "COMPLETED" };
    const tasks = rooms.flatMap((r) => r.tasks.map((t) => ({ ...t, roomNumber: r.roomNumber })));
    document.getElementById("hkTasksBody").innerHTML = tasks.length ? html.join(tasks.map((t) => html`
      <tr>
        <td>${t.roomNumber}</td><td>${t.type.replace(/_/g, " ")}</td>
        <td><span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span></td>
        <td><span class="badge badge-${t.status.toLowerCase()}">${t.status.replace(/_/g, " ")}</span></td>
        <td>${canManage && TASK_NEXT[t.status] ? html`<button class="btn btn-sm btn-outline" onclick="advanceTask('${t.id}','${TASK_NEXT[t.status]}')">${taskActionLabel(t.status)}</button>` : ""}</td>
      </tr>
    `)) : html`<tr><td colspan="5" class="empty-state">No open tasks.</td></tr>`;

    const issues = rooms.flatMap((r) => r.workOrders.map((w) => ({ ...w, roomNumber: r.roomNumber })));
    document.getElementById("hkMaintBody").innerHTML = issues.length ? html.join(issues.map((w) => html`
      <tr>
        <td>${w.roomNumber || "—"}</td><td>${w.title}</td>
        <td><span class="badge badge-${w.priority.toLowerCase()}">${w.priority}</span></td>
        <td><span class="badge badge-${w.status.toLowerCase()}">${w.status.replace(/_/g, " ")}</span></td>
        <td>${canManage ? html`<button class="btn btn-sm btn-outline" onclick="resolveMaintenance('${w.id}')">Resolve</button>` : ""}</td>
      </tr>
    `)) : html`<tr><td colspan="5" class="empty-state">No open issues.</td></tr>`;

    const roomOptions = html.join(rooms.map((r) => html`<option value="${r.id}">${r.roomNumber}</option>`));
    document.getElementById("tkRoomId").innerHTML = roomOptions;
    document.getElementById("mtRoomId").innerHTML = html`<option value="">— Common area —</option>` + roomOptions;
  } catch (err) {
    showNotice("housekeepingNotice", err.message);
  }

const ORDER_TYPE_PERMISSION = { ROOM_SERVICE: "manage_menu", RESTAURANT: "manage_menu", BAR: "manage_menu", LAUNDRY: "manage_laundry", SPA: "manage_spa" };

let _poSelectedGuestId = null;
let _poCatalogItems = [];

async function onOrderTypeChange() {
  const type = document.getElementById("poType").value;
  _poCart = [];
  const catalogEl = document.getElementById("poCatalog");
  catalogEl.innerHTML = html`<div class="loading-state">Loading catalog…</div>`;

  try {
    if (type === "SPA") {
      const { spaTreatments } = await staffApi.listSpaTreatments();
      _poCatalogItems = spaTreatments;
      catalogEl.innerHTML = html`
        <div class="form-row">
          <div class="form-field"><label>Treatment</label>
            <select id="poSpaTreatment" onchange="updatePoTotal()">
              ${html.join(spaTreatments.map((t) => html`<option value="${t.id}" data-price="${t.price}" data-currency="${t.currency}">${t.name} — ${money(t.price, t.currency)}</option>`))}
            </select>
          </div>
          <div class="form-field"><label>Date &amp; time</label><input type="datetime-local" id="poSpaTime"></div>
        </div>
      `;
    } else if (type === "LAUNDRY") {
      const { laundryItems } = await staffApi.listLaundryItems();
      _poCatalogItems = laundryItems;
      catalogEl.innerHTML = html`
        <table><thead><tr><th>Item</th><th>Price</th><th></th></tr></thead>
          <tbody>${laundryItems.length ? html.join(laundryItems.map((i) => html`
            <tr><td>${i.name}</td><td>${money(i.price, i.currency)}</td>
            <td><button type="button" class="btn btn-sm btn-outline" onclick="addToPoCart('${i.id}')">Add</button></td></tr>
          `)) : html`<tr><td colspan="3" class="empty-state">Nothing available.</td></tr>`}</tbody>
        </table>
        <div id="poCartWrap" style="margin-top:14px;"></div>
      `;
      renderPoCart();
    } else {
      const { menuItems } = await staffApi.listMenuItems(type === "BAR" ? "DRINK" : "FOOD");
      const items = type === "ROOM_SERVICE" ? menuItems.filter((i) => i.availableForRoomService) : menuItems;
      _poCatalogItems = items;
      catalogEl.innerHTML = html`
        <table><thead><tr><th>Item</th><th>Price</th><th></th></tr></thead>
          <tbody>${items.length ? html.join(items.map((i) => html`
            <tr><td>${i.name}</td><td>${money(i.price, i.currency)}</td>
            <td><button type="button" class="btn btn-sm btn-outline" onclick="addToPoCart('${i.id}')">Add</button></td></tr>
          `)) : html`<tr><td colspan="3" class="empty-state">Nothing available${type === "ROOM_SERVICE" ? " for room service" : ""}.</td></tr>`}</tbody>
        </table>
        <div id="poCartWrap" style="margin-top:14px;"></div>
      `;
      renderPoCart();
    }
  } catch (err) {
    catalogEl.innerHTML = html`<div class="empty-state">${err.message}</div>`;
  }
  updatePoTotal();
}

function addToPoCart(itemId) {
  const item = _poCatalogItems.find((i) => i.id === itemId);
  if (!item) return;
  const existing = _poCart.find((l) => l.id === itemId);
  if (existing) existing.quantity += 1;
  else _poCart.push({ id: item.id, name: item.name, price: Number(item.price), currency: item.currency, quantity: 1 });
  renderPoCart();
  updatePoTotal();
}
function removeFromPoCart(itemId) {
  _poCart = _poCart.filter((l) => l.id !== itemId);
  renderPoCart();
  updatePoTotal();
}
function renderPoCart() {
  const wrap = document.getElementById("poCartWrap");
  if (!wrap) return;
  wrap.innerHTML = _poCart.length ? html`
    <table><thead><tr><th>Item</th><th>Qty</th><th>Line total</th><th></th></tr></thead>
      <tbody>${html.join(_poCart.map((l) => html`
        <tr><td>${l.name}</td><td>${l.quantity}</td><td>${money(l.price * l.quantity, l.currency)}</td>
        <td><button type="button" class="btn btn-sm btn-danger" onclick="removeFromPoCart('${l.id}')">Remove</button></td></tr>
      `))}</tbody>
    </table>
  ` : html`<p style="color:var(--text-muted); font-size:0.84rem;">No items added yet.</p>`;
}

function updatePoTotal() {
  const type = document.getElementById("poType").value;
  let total = 0;
  const byCurrency = {}; // never add prices in different currencies together
  if (type === "SPA") {
    const sel = document.getElementById("poSpaTreatment");
    const opt = sel && sel.selectedOptions[0];
    total = opt ? Number(opt.dataset.price || 0) : 0;
    if (opt) byCurrency[opt.dataset.currency || ""] = total;
  } else {
    for (const l of _poCart) {
      const amt = l.price * l.quantity;
      total += amt; byCurrency[l.currency || ""] = (byCurrency[l.currency || ""] || 0) + amt;
    }
  }
  const parts = Object.entries(byCurrency).map(([c, a]) => money(a, c));
  document.getElementById("poTotalDisplay").textContent = parts.length ? parts.join(" + ") : "—";
  return total;
}

let _poSearchTimer = null;
function searchGuestDebounced() {
  clearTimeout(_poSearchTimer);
  _poSearchTimer = setTimeout(async () => {
    const q = document.getElementById("poGuestSearch").value.trim();
    const resultsEl = document.getElementById("poGuestResults");
    if (q.length < 3) { resultsEl.innerHTML = q.length ? html`<p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Keep typing — at least 3 characters.</p>` : ""; return; }
    try {
      const { guests } = await staffApi.searchGuests(q);
      resultsEl.innerHTML = guests.length ? html.join(guests.map((g) => html`
        <button type="button" class="tray-item" style="border:1px solid var(--border); border-radius:6px; margin-top:4px;" onclick='selectGuest(${refJs(g)})'>
          <b>${g.name}</b> <span>${g.email}${g.phone ? " · " + g.phone : ""}</span>
        </button>
      `)) : html`<p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">No match — enter their details below instead.</p>`;
    } catch { /* search failing shouldn't block manual entry below */ }
  }, 350);
}
function selectGuest(guest) {
  _poSelectedGuestId = guest.id;
  document.getElementById("poSelectedGuestName").textContent = guest.name;
  document.getElementById("poSelectedGuestEmail").textContent = guest.email;
  document.getElementById("poSelectedGuest").style.display = "block";
  document.getElementById("poNewGuestFields").style.display = "none";
  document.getElementById("poGuestResults").innerHTML = "";
  document.getElementById("poGuestSearch").value = "";
}
function clearSelectedGuest() {
  _poSelectedGuestId = null;
  document.getElementById("poSelectedGuest").style.display = "none";
  document.getElementById("poNewGuestFields").style.display = "block";
}

async function submitWalkInOrder() {
  const btn = document.getElementById("poSubmitBtn");
  const type = document.getElementById("poType").value;
  const total = updatePoTotal();
  const paymentChoice = document.getElementById("poPayment").value;
  const roomId = document.getElementById("poRoom").value || undefined;

  if (!_poSelectedGuestId && (!document.getElementById("poGuestName").value || !document.getElementById("poGuestEmail").value)) {
    showNotice("placeOrderNotice", "Select an existing guest or enter a name and email for a new one.");
    return;
  }
  if (paymentChoice === "ROOM" && !roomId) {
    showNotice("placeOrderNotice", "Select a room to charge this to, or choose a different payment option.");
    return;
  }

  const payload = {
    type,
    existingGuestId: _poSelectedGuestId || undefined,
    guest: _poSelectedGuestId ? undefined : {
      name: document.getElementById("poGuestName").value,
      email: document.getElementById("poGuestEmail").value,
      phone: document.getElementById("poGuestPhone").value || undefined,
    },
    roomId,
    chargeToRoom: paymentChoice === "ROOM",
  };

  if (type === "SPA") {
    payload.treatmentId = document.getElementById("poSpaTreatment").value;
    payload.scheduledAt = fromLocalInput(document.getElementById("poSpaTime").value);
    if (!payload.scheduledAt) { showNotice("placeOrderNotice", "Pick a date and time for the appointment."); return; }
  } else {
    if (!_poCart.length) { showNotice("placeOrderNotice", "Add at least one item."); return; }
    payload.lines = _poCart.map((l) => ({ [type === "LAUNDRY" ? "laundryItemId" : "menuItemId"]: l.id, quantity: l.quantity }));
  }

  btn.disabled = true;
  try {
    const { order } = await staffApi.createWalkInOrder(payload);

    if (paymentChoice === "NOW" && order.totalAmount) {
      try {
        await staffApi.recordTransaction({
          orderId: order.id,
          guestName: _poSelectedGuestId ? document.getElementById("poSelectedGuestName").textContent : document.getElementById("poGuestName").value,
          source: ORDER_TYPE_TRANSACTION_SOURCE[type],
          amount: order.totalAmount,
          method: document.getElementById("poMethod").value,
        });
      } catch (err) {
        showNotice("placeOrderNotice", `Order placed, but recording the payment failed: ${err.message}. Ask a Manager to record the payment, or open the order from Orders and take it there.`, "error");
        return;
      }
    }

    showNotice("placeOrderNotice", "Order placed.", "success");
    await loadPlaceOrderPage();
  } catch (err) {
    showNotice("placeOrderNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

/* ============================================================
   ORDER DETAIL — line-level management (manage_orders). Anyone with
   manage_bookings can view; only manage_orders can add/void a line;
   only manage_payments can reopen a closed order — matching the
   backend's own permission split exactly.
   ============================================================ */
let _odOrderId = null;
async function openOrderDetailModal(id) {
  _odOrderId = id;
  document.getElementById("orderDetailNotice").innerHTML = "";
  document.getElementById("orderDetailModal").style.display = "flex";
  await refreshOrderDetail();
}
function closeOrderDetailModal() { document.getElementById("orderDetailModal").style.display = "none"; }

async function refreshOrderDetail() {
  const body = document.getElementById("orderDetailBody");
  try {
    const { order } = await staffApi.getOrder(_odOrderId);
    _odOrder = order;
    const canEditLines = hasPermission("manage_orders");
    const canReopen = hasPermission("manage_payments");
    body.innerHTML = html`
      <p style="font-size:0.84rem; color:var(--text-muted); margin-bottom:10px;">${order.guest.name} · <span class="badge badge-${order.status.toLowerCase()}">${order.status}</span> ${order.isOpen ? "" : "· Closed"}</p>
      <table><thead><tr><th>Item</th><th>Qty</th><th>Line total</th><th>Status</th>${canEditLines ? raw("<th></th>") : ""}</tr></thead>
        <tbody>${order.lines.length ? html.join(order.lines.map((l) => html`
          <tr>
            <td>${l.itemName}</td><td>${l.quantity}</td>
            <td>${money(Number(l.unitPrice) * l.quantity, order.currency)}</td>
            <td><span class="badge badge-${l.status.toLowerCase()}">${l.status}</span></td>
            ${canEditLines ? html`<td>${l.status === "ACTIVE" ? html`<button class="btn btn-sm btn-danger" onclick="voidOrderLineRow('${l.id}')">Void</button>` : ""}</td>` : ""}
          </tr>
        `)) : html`<tr><td colspan="${canEditLines ? 5 : 4}" class="empty-state">No items on this order.</td></tr>`}</tbody>
      </table>
      <div class="summary-line total" style="margin-top:10px;"><span>Total</span><span>${money(order.totalAmount || 0, order.currency)}</span></div>
      ${orderPayBlock(order)}
      ${canEditLines && order.isOpen ? html`
        <form id="addLineForm" style="border-top:1px solid var(--border); margin-top:16px; padding-top:16px;">
          <div class="form-row">
            <div class="form-field"><label>Add item</label><select id="odMenuItemId"><option value="">Loading…</option></select></div>
            <div class="form-field"><label>Qty</label><input type="number" id="odQty" value="1" min="1"></div>
          </div>
          <button type="submit" class="btn btn-sm btn-outline">Add to order</button>
        </form>
      ` : ""}
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeOrderDetailModal()">Close</button>
        ${canEditLines && order.isOpen ? html`<button type="button" class="btn btn-danger" onclick="closeOrderRow()">Close order</button>` : ""}
        ${canReopen && !order.isOpen ? html`<button type="button" class="btn btn-outline" onclick="reopenOrderRow()">Reopen order</button>` : ""}
      </div>
    `;
    if (canEditLines && order.isOpen) {
      const menuSelect = document.getElementById("odMenuItemId");
      try {
        const { menuItems } = await staffApi.listMenuItems();
        menuSelect.innerHTML = html.join(menuItems.map((m) => html`<option value="${m.id}">${m.name} — ${money(m.price, m.currency)}</option>`));
      } catch { menuSelect.innerHTML = html`<option value="">Couldn't load menu</option>`; }
      document.getElementById("addLineForm").addEventListener("submit", submitAddOrderLine);
    }
  } catch (err) {
    body.innerHTML = html`<div class="notice error">${err.message}</div>`;
  }
}

async function submitAddOrderLine(e) {
  e.preventDefault();
  const menuItemId = document.getElementById("odMenuItemId").value;
  const quantity = Number(document.getElementById("odQty").value) || 1;
  if (!menuItemId) return;
  try {
    await staffApi.addOrderLine(_odOrderId, { menuItemId, quantity });
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }
}
async function voidOrderLineRow(lineId) {
  const reason = await uiPrompt("Reason for voiding this item (required):", { title: "Void item", confirmText: "Void item", danger: true, minLength: 3 });
  if (!reason || reason.trim().length < 3) { if (reason !== null) showNotice("orderDetailNotice", "A reason of at least 3 characters is required."); return; }
  try {
    await staffApi.voidOrderLine(_odOrderId, lineId, { reason: reason.trim() });
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }
}
async function closeOrderRow() {
  if (!(await uiConfirm("Close this order? No more items can be added unless it's reopened.", { title: "Close order", confirmText: "Close order" }))) return;
  try {
    await staffApi.closeOrder(_odOrderId);
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }
}
async function reopenOrderRow() {
  try {
    await staffApi.reopenOrder(_odOrderId);
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }
}

async function populateRoomSelect(selectEl, selectedRoomId, includeAutoOption) {
  selectEl.innerHTML = html`<option value="">Loading…</option>`;
  try {
    const { rooms } = await staffApi.listRooms();
    selectEl.innerHTML = (includeAutoOption ? html`<option value="">— Auto-assign —</option>` : "")
      + html.join(rooms.map((r) => html`<option value="${r.id}" ${r.id === selectedRoomId ? "selected" : ""}>${r.name} — ${r.roomNumber}</option>`));
  } catch { selectEl.innerHTML = includeAutoOption ? html`<option value="">— Auto-assign —</option>` : html`<option value="">Couldn't load rooms</option>`; }
}

async function openCheckInModal(bookingId) {
  const booking = _bookingsCache.find((b) => b.id === bookingId);
  document.getElementById("checkInForm").reset();
  document.getElementById("checkInNotice").innerHTML = "";
  document.getElementById("ciBookingId").value = bookingId;
  document.getElementById("ciGuestName").textContent = booking ? booking.guest.name : "";
  document.getElementById("ciOverrideField").style.display = "none";
  await populateRoomSelect(document.getElementById("ciRoomId"), booking?.room?.id, true);
  document.getElementById("checkInModal").style.display = "flex";
}
function closeCheckInModal() { document.getElementById("checkInModal").style.display = "none"; }

async function submitCheckInForm(e) {
  e.preventDefault();
  const btn = document.getElementById("ciSubmitBtn");
  btn.disabled = true;
  const bookingId = document.getElementById("ciBookingId").value;
  const keysRaw = document.getElementById("ciKeys").value.trim();
  const depositAmount = document.getElementById("ciDepositAmount").value;
  const payload = {
    registration: {
      fullName: document.getElementById("ciFullName").value,
      idType: document.getElementById("ciIdType").value,
      idNumber: document.getElementById("ciIdNumber").value,
    },
    roomId: document.getElementById("ciRoomId").value || undefined,
    overrideHousekeeping: document.getElementById("ciOverrideHousekeeping").checked || undefined,
    deposit: depositAmount ? { amount: Number(depositAmount), method: document.getElementById("ciDepositMethod").value } : undefined,
    keys: keysRaw ? keysRaw.split(",").map((label) => ({ label: label.trim() })).filter((k) => k.label) : undefined,
  };
  try {
    await staffApi.checkInBooking(bookingId, payload);
    closeCheckInModal();
    showNotice("bookingsNotice", "Guest checked in.", "success");
    refreshBookingsTable();
  } catch (err) {
    if (err.code === "ROOM_NOT_READY") document.getElementById("ciOverrideField").style.display = "block";
    showNotice("checkInNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function submitAssignRoomForm(e) {

/* ============================================================
   FOLIO — the guest's running room-charge tab. Only relevant for a
   CHECKED_IN booking. Checkout is blocked server-side while a balance
   is outstanding, so this modal is the only path to checking someone
   out once they've charged anything to their room.
   ============================================================ */
async function openFolioModal(bookingId) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay"; overlay.id = "folioModal";
  overlay.innerHTML = html`
    <div class="modal" style="max-width:600px;">
      <h3>Room folio</h3>
      <div id="folioModalNotice"></div>
      <div id="folioModalContent"><div class="loading-state">Loading…</div></div>
    </div>`;
  document.body.appendChild(overlay);
  await refreshFolioModal(bookingId);
}

async function refreshFolioModal(bookingId) {
  try {
    const { booking, charges, balance, currency: folioCurrency } = await staffApi.getFolio(bookingId);
    document.getElementById("folioModalContent").innerHTML = html`
      <p style="color:var(--text-muted); font-size:0.86rem; margin-bottom:12px;">${booking.guestName} — Room ${booking.roomNumber}</p>
      ${charges.length ? html`
        <table><thead><tr><th>Type</th><th>Placed</th><th style="text-align:right;">Amount</th></tr></thead>
          <tbody>${html.join(charges.map((c) => html`<tr><td>${c.type.replace(/_/g, " ")}</td><td>${fmtDT(c.createdAt)}</td><td style="text-align:right;">${money(c.totalAmount, c.currency || folioCurrency)}</td></tr>`))}</tbody>
        </table>
        <div class="summary-line total" style="margin-top:10px;"><span>Balance due</span><span>${money(balance, folioCurrency)}</span></div>
        <form id="folioSettleForm" style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
          <div class="form-field">
            <label>Settle by</label>
            <select id="folioMethod">
              <option value="CASH">Cash</option>
              <option value="CARD">Card</option>
              <option value="TRANSFER">Transfer</option>
              <option value="PAYSTACK">Paystack</option>
              <option value="STRIPE">Stripe</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="document.getElementById('folioModal').remove()">Close</button>
            <button type="submit" class="btn btn-primary" id="folioSettleBtn">Settle &amp; check out</button>
          </div>
        </form>
      ` : html`
        <div class="empty-state">No room charges on this stay.</div>
        <div class="modal-actions" style="margin-top:14px;">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('folioModal').remove()">Close</button>
          <button type="button" class="btn btn-primary" onclick="checkOutFromFolio('${bookingId}')">Check out</button>
        </div>
      `}
    `;
    if (charges.length) {
      document.getElementById("folioSettleForm").addEventListener("submit", (e) => { e.preventDefault(); settleFolioAndCheckOut(bookingId); });
    }
  } catch (err) {
    document.getElementById("folioModalContent").innerHTML = html`<div class="notice error">${err.message}</div>`;
  }
}

async function performCheckOut(bookingId, extraFlags = {}) {
  try {
    await staffApi.checkOutBooking(bookingId, extraFlags);
  } catch (err) {
    if (err.code === "KEYS_OUTSTANDING" && !extraFlags.acceptMissingKeys) {
      if (await uiConfirm(`${err.message} Check out anyway?`, { title: "Keys not returned", confirmText: "Check out anyway", danger: true })) return performCheckOut(bookingId, { ...extraFlags, acceptMissingKeys: true });
      throw new Error("Checkout cancelled.");
    }
    throw err;
  }
}

async function settleFolioAndCheckOut(bookingId) {
  const btn = document.getElementById("folioSettleBtn");
  const method = document.getElementById("folioMethod").value;
  if (btn) { btn.disabled = true; btn.textContent = "Settling…"; }
  try {
    await staffApi.settleFolio(bookingId, method);
    await performCheckOut(bookingId);
    document.getElementById("folioModal").remove();
    showNotice("bookingsNotice", "Folio settled and guest checked out.", "success");
    refreshBookingsTable();
  } catch (err) {
    document.getElementById("folioModalNotice").innerHTML = html`<div class="notice error">${err.message}</div>`;
    if (btn) { btn.disabled = false; btn.textContent = "Settle & check out"; }
  }
}

async function checkOutFromFolio(bookingId) {
  try {
    await performCheckOut(bookingId);
    document.getElementById("folioModal").remove();
    showNotice("bookingsNotice", "Guest checked out.", "success");
    refreshBookingsTable();
  } catch (err) {
    document.getElementById("folioModalNotice").innerHTML = html`<div class="notice error">${err.message}</div>`;
  }
}

function todayLocal(offsetDays = 0) { const d = new Date(); d.setDate(d.getDate() + offsetDays); const p = (x) => String(x).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function ageLabel(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return m < 1 ? "just now" : m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h` : `${Math.floor(m / 1440)} d`;
}
function ageMinutes(iso) { return Math.round((Date.now() - new Date(iso).getTime()) / 60000); }

/* ---------- dialogs (replace the browser's prompt/confirm) ---------- */
let _dlgSeq = 0;
function uiDialog({ title, message, input, confirmText = "OK", cancelText = "Cancel", danger = false, minLength = 0 }) {
  return new Promise((resolve) => {
    const id = `dlg${++_dlgSeq}`;
    const ov = document.createElement("div");
    ov.className = "modal-overlay"; ov.id = id; ov.setAttribute("data-dlg", "1"); ov.style.zIndex = "3000";
    ov.innerHTML = html`<div class="modal" style="max-width:440px;" role="alertdialog" aria-modal="true" aria-labelledby="${id}t" aria-describedby="${id}m">
      <h3 id="${id}t">${title || "Please confirm"}</h3>
      <p id="${id}m" style="font-size:0.9rem; line-height:1.5; margin-bottom:${input ? 12 : 4}px;">${message}</p>
      <form>
        ${input ? html`<div class="form-field"><label for="${id}i" class="sr-only">${message}</label><input type="text" id="${id}i" autocomplete="off"></div><div id="${id}e" class="notice error" role="alert" style="display:none;"></div>` : ""}
        <div class="modal-actions"><button type="button" class="btn btn-outline" data-cancel>${cancelText}</button><button type="submit" class="btn ${danger ? "btn-danger" : "btn-primary"}">${confirmText}</button></div>
      </form></div>`;

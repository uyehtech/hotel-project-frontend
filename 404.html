<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Uyeh Hotel</title>
<meta name="description" content="This page doesn't exist — but every location and every room is still one click away.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#14181f">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#14181f; --ink-soft:#1c222b; --ink-deep:#0d1015;
  --ivory:#f6f1e7; --ivory-dim:#ede5d4;
  --brass:#b98d45; --brass-light:#d9b876;
  --teal:#2f5d5a; --teal-light:#3f7a76;
  --text-muted:#6b6355; --text-on-ink:#ede6d6;
  --line-on-ink:rgba(237,230,214,0.16);
  --radius:3px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;font-family:var(--font-body);background:var(--ink);color:var(--text-on-ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2{font-family:var(--font-display);font-weight:500;line-height:1.1;letter-spacing:-0.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:0 28px}
.brand{font-family:var(--font-display);font-size:1.22rem;letter-spacing:.02em;color:var(--ivory);padding:26px 28px;display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
main::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 30%,rgba(47,93,90,.35),transparent 60%)}
.content{position:relative;z-index:2;text-align:center}
.ghost{font-family:var(--font-display);font-size:clamp(5rem,18vw,9rem);color:var(--brass);opacity:.9;line-height:1;margin-bottom:8px}
.eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brass-light);margin-bottom:16px;display:inline-flex;align-items:center;gap:8px}
.eyebrow::before,.eyebrow::after{content:"";width:24px;height:1px;background:var(--brass)}
h1{font-size:clamp(1.6rem,3.5vw,2.2rem);margin-bottom:14px}
p{color:rgba(237,230,214,.7);max-width:44ch;margin:0 auto 36px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 26px;border-radius:2px;font-size:.9rem;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.25s}
.btn-primary{background:var(--brass);color:var(--ink)}
.btn-primary:hover{background:var(--brass-light)}
.btn-ghost{border-color:var(--line-on-ink);color:var(--text-on-ink)}
.btn-ghost:hover{border-color:var(--brass-light);color:var(--brass-light)}
footer{text-align:center;padding:24px;font-size:.78rem;color:rgba(237,230,214,.4)}
</style>
</head>
<body>
<a href="index.html" class="brand" id="navBrand">Uyeh Hotel</a>

<main>
  <div class="wrap content">
    <div class="ghost">404</div>
    <p class="eyebrow">Wrong turn</p>
    <h1>This page checked out early.</h1>
    <p>The link might be old, or the page may have moved. Everything else is still exactly where it should be.</p>
    <div class="actions">
      <a href="index.html" class="btn btn-primary">Back to home</a>
      <a href="index.html#locations" class="btn btn-ghost">Browse locations</a>
      <a href="contact.html" class="btn btn-ghost">Contact us</a>
    </div>
  </div>
</main>

<footer>&copy; <span id="year"></span> <span id="footerName">Uyeh Hotel</span></footer>

<script>
(function () {
  "use strict";
  const API_BASE = "https://uyeh-hotel-backend.onrender.com/api";
  document.getElementById("year").textContent = new Date().getFullYear();

  // Brand name only — this page intentionally skips footer.js (no
  // newsletter/sitemap needed on an error page) but should still say the
  // right name instead of a hardcoded "Uyeh Hotel".
  fetch(`${API_BASE}/settings`)
    .then((r) => r.json())
    .then(({ settings }) => {
      const name = settings.platformName || "Uyeh Hotel";
      document.title = document.title.replace("Uyeh Hotel", name);
      document.getElementById("navBrand").textContent = name;
      document.getElementById("footerName").textContent = name;
    })
    .catch(() => {});
})();
</script>
</body>
</html>

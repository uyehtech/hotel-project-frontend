<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Stay</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.0/socket.io.min.js"></script>
<script src="config.js"></script>
<script src="web-core.js"></script>
<script src="site-controller.js" defer></script>
<style>
/* ============================================================
   Uyeh HOTEL — GUEST PANEL
   Public-facing booking site. Same brand tokens as the admin
   tools, different shell: top nav instead of sidebar. Guests
   register/login, search & book rooms (with food/drink/service
   add-ons), manage their own bookings, message support, and
   edit their profile. Single-file SPA.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #14181f; --ivory: #f6f1e7; --panel: #ffffff;
  --border: #e6e0d2; --border-soft: rgba(20,24,31,0.08);
  --brass: #b98d45; --brass-dark: #96712f; --teal: #2f5d5a; --danger: #a3392a; --info: #3b6ea5;
  --text-muted: #6b6355;
  --font-display: 'Fraunces', serif; --font-body: 'Inter', -apple-system, sans-serif; --radius: 10px;
}

body { font-family: var(--font-body); background: var(--ivory); color: var(--ink); font-size: 14px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
a { color: inherit; text-decoration: none; }

/* AUTH SCREEN */
.auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ink); padding: 20px; }
.auth-card { background: var(--panel); padding: 44px 40px; border-radius: var(--radius); width: 100%; max-width: 400px; }
.auth-card .brand { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 4px; }
.auth-card .brand span { color: var(--brass); }
.auth-card p.sub { color: var(--text-muted); margin-bottom: 22px; font-size: 0.88rem; }
.auth-tabs { display: flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
.auth-tab-btn { flex: 1; background: none; border: none; padding: 10px; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.auth-tab-btn.active { color: var(--brass-dark); border-bottom-color: var(--brass); }

/* SHELL */
.navbar { background: var(--ink); padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 500; height: 68px; }
.nav-brand { display: flex; align-items: center; gap: 10px; color: #ede6d6; font-family: var(--font-display); font-size: 1.15rem; cursor: pointer; }
.nav-brand .logo-icon { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, var(--brass-dark), var(--brass));
  display: flex; align-items: center; justify-content: center; color: var(--ink); font-weight: 700; }
.nav-brand span { color: var(--brass); }
.nav-links { display: flex; align-items: center; gap: 6px; }
.nav-link { padding: 10px 16px; color: rgba(237,230,214,0.65); font-size: 0.86rem; font-weight: 500; cursor: pointer; border-radius: 6px; position: relative; }
.nav-link:hover { color: #ede6d6; background: rgba(255,255,255,0.04); }
.nav-link.active { color: var(--brass); }
.nav-link .nav-badge { position: absolute; top: 4px; right: 6px; background: var(--danger); color: #fff; font-size: 0.6rem; font-weight: 700;
  padding: 1px 5px; border-radius: 8px; display: none; }
.nav-link .nav-badge.visible { display: inline-block; }
.nav-user { display: flex; align-items: center; gap: 12px; }
.nav-user-name { color: #ede6d6; font-size: 0.84rem; }
.nav-logout { color: rgba(237,230,214,0.5); font-size: 0.8rem; cursor: pointer; }
.nav-logout:hover { color: #ede6d6; }
.mobile-nav-toggle { display: none; background: none; border: none; color: #ede6d6; font-size: 1.3rem; cursor: pointer; }

.page-content { max-width: 1080px; margin: 0 auto; padding: 34px 24px 70px; }
.page-header { margin-bottom: 24px; }
.page-title { font-size: 1.7rem; }
.page-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

/* HERO / SEARCH */
.hero { background: var(--ink); border-radius: var(--radius); padding: 46px 36px; margin-bottom: 28px; color: #ede6d6; }
.hero h1 { font-size: 2rem; margin-bottom: 8px; }
.hero h1 span { color: var(--brass); }
.hero p { color: rgba(237,230,214,0.7); margin-bottom: 26px; font-size: 0.92rem; }
.search-panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); padding: 20px; }
.search-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.7fr auto; gap: 12px; align-items: end; }
.search-field label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: rgba(237,230,214,0.55); margin-bottom: 6px; }
.search-field input, .search-field select { width: 100%; padding: 11px 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.95); font-family: var(--font-body); font-size: 0.86rem; }

/* CARDS / GRIDS */
.room-grid, .offering-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.room-card, .offering-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; position: relative; }
.room-card h3, .offering-card h4 { font-size: 1.05rem; margin-bottom: 6px; }
.room-card .price, .offering-card .price { font-family: var(--font-display); font-size: 1.3rem; color: var(--brass-dark); margin: 10px 0; }
.room-card .meta, .offering-card .meta { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 12px; }
.card-photo { width: calc(100% + 40px); margin: -20px -20px 14px -20px; height: 160px; object-fit: cover; border-radius: var(--radius) var(--radius) 0 0; display: block; }
.card-photo-placeholder { width: calc(100% + 40px); margin: -20px -20px 14px -20px; height: 160px; border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(135deg, var(--border), var(--ivory)); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 1.6rem; }
.card-heart { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(20,24,31,0.55);
  color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.card-heart.saved { background: var(--danger); }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }
.panel h3 { font-size: 1.05rem; margin-bottom: 14px; }

table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
tr:last-child td { border-bottom: none; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; text-transform: capitalize; }
.badge-confirmed, .badge-checked_in, .badge-resolved, .badge-paid { background: rgba(47,93,90,0.12); color: var(--teal); }
.badge-cancelled, .badge-refunded { background: rgba(163,57,42,0.1); color: var(--danger); }
.badge-pending, .badge-open { background: rgba(179,140,43,0.14); color: var(--brass-dark); }
.badge-checked_out, .badge-in_progress { background: rgba(59,110,165,0.12); color: var(--info); }

.btn { font-family: var(--font-body); font-size: 0.84rem; font-weight: 600; padding: 11px 20px; border-radius: 7px; border: none; cursor: pointer; transition: opacity 0.15s; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--brass); color: var(--ink); }
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink); }
.btn-outline:hover:not(:disabled) { background: var(--ivory); }
.btn-danger { background: rgba(163,57,42,0.1); color: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 0.78rem; margin-right: 6px; }
.btn-block { width: 100%; }

.loading-state, .empty-state { text-align: center; color: var(--text-muted); padding: 34px; font-size: 0.86rem; }
.coming-soon { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.coming-soon i { font-size: 2rem; color: var(--brass); margin-bottom: 12px; display: block; }

.notice { padding: 12px 16px; border-radius: 7px; font-size: 0.84rem; margin-bottom: 14px; }
.notice.error { background: rgba(163,57,42,0.08); color: var(--danger); border: 1px solid rgba(163,57,42,0.2); }
.notice.success { background: rgba(47,93,90,0.08); color: var(--teal); border: 1px solid rgba(47,93,90,0.2); }
.notice.info { background: rgba(31,41,55,0.06); color: var(--text, #1f2937); border: 1px solid rgba(31,41,55,0.18); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }
.form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px; font-family: var(--font-body); font-size: 0.86rem; background: #fff; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
.checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; font-weight: 400 !important; cursor: pointer; padding: 6px 0; }
.checkbox-item input { width: auto !important; }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,24,31,0.55); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; overflow-y: auto; }
.modal { background: var(--panel); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.summary-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.86rem; border-bottom: 1px solid var(--border-soft); }
.summary-line.total { font-weight: 700; border-bottom: none; padding-top: 12px; font-size: 0.98rem; }

.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn { background: none; border: none; padding: 10px 16px; font-family: var(--font-body); font-size: 0.86rem; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--brass-dark); border-bottom-color: var(--brass); }

.chat-thread { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; max-height: 340px; overflow-y: auto; }
.chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; }
.chat-bubble.mine { align-self: flex-end; background: var(--brass); color: var(--ink); border-bottom-right-radius: 3px; }
.chat-bubble.theirs { align-self: flex-start; background: var(--ivory); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
.chat-bubble .meta { font-size: 0.68rem; opacity: 0.65; margin-top: 4px; }

@media (max-width: 860px) {
  .nav-links { display: none; }
  .mobile-nav-toggle { display: block; }
  .search-grid { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="brand" id="authBrand">Our Hotel</div>
    <p class="sub">Book your stay, manage reservations, and get support — all in one place.</p>
    <div class="auth-tabs" id="authTabs">
      <button class="auth-tab-btn active" data-tab="login" onclick="switchAuthTab('login')">Log in</button>
      <button class="auth-tab-btn" data-tab="register" onclick="switchAuthTab('register')">Create account</button>
    </div>
    <div id="authNotice"></div>

    <form id="loginForm">
      <div class="form-field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="form-field"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log in</button>
    </form>

    <form id="registerForm" style="display:none;">
      <div class="form-field"><label>Full name</label><input type="text" id="regName" required></div>
      <div class="form-field"><label>Email</label><input type="email" id="regEmail" required></div>
      <div class="form-field"><label>Phone</label><input type="text" id="regPhone"></div>
      <div class="form-field"><label>Password</label><input type="password" id="regPassword" required minlength="8"></div>
      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create account</button>
    </form>

    <form id="twoFactorForm" style="display:none;">
      <p class="sub" style="margin-top:0;">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div class="form-field"><label>Code</label><input type="text" id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required autofocus></div>
      <button type="submit" class="btn btn-primary btn-block" id="twoFactorBtn">Verify</button>
      <button type="button" id="twoFactorBackBtn" style="width:100%; margin-top:10px; background:none; border:none; color:var(--text-muted); font-size:0.85rem; cursor:pointer;">&larr; Back to login</button>
    </form>
  </div>
</div>

<div id="appShell" style="display:none;">
  <div class="navbar">
    <div class="nav-brand" onclick="switchPage('search')"><div class="logo-icon" id="navBrandIcon">H</div><span id="navBrandText">Our Hotel</span></div>
    <div class="nav-links" id="navLinks"></div>
    <div class="nav-user">
      <span class="nav-user-name" id="navUserName"></span>
      <span class="nav-logout" id="logoutBtn">Log out</span>
    </div>
    <button class="mobile-nav-toggle" id="mobileNavToggle"><i class="fas fa-bars"></i></button>
  </div>
  <div class="page-content" id="pageContent"></div>
</div>

<script>
/* ============================================================
   SAFE HTML (F2) — every ${} inside an html`...` template is escaped for
   the exact place it lands: element text, a normal attribute, a URL
   attribute (scheme allow-list), a style attribute, or inside a
   quoted JavaScript string of an on*="" handler. Nothing the server
   (or another guest) wrote can break out of its slot.
     html`...`      -> SafeHtml (assign to .innerHTML directly)
     raw(str)       -> trusted markup, inserted as-is
     html.join(arr) -> SafeHtml of an array of items ("" when empty)
     refJs(obj)     -> JS expression for onclick that hands `obj` back
   ============================================================ */
class SafeHtml { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = (s) => new SafeHtml(String(s == null ? "" : s));
const _ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const escHtml = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => _ESC[c]);
const _jsStr = (v) => String(v == null ? "" : v).replace(/[\\'"<>&\u0000-\u001f\u2028\u2029`$]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
const _URL_ATTRS = new Set(["href", "src", "action", "formaction", "poster", "cite", "data", "xlink:href"]);
function _safeUrl(v, tag, attr) {
  const s = String(v == null ? "" : v).trim();
  const probe = s.replace(/[\u0000-  ]/g, "");
  if (!/^[a-z][a-z0-9+.\-]*:/i.test(probe)) return s; // relative, #, ?, //host
  if (/^(https?:|mailto:|tel:)/i.test(probe)) return s;
  if (tag === "img" && attr === "src" && /^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+\/=]+$/i.test(probe)) return s;
  return "";
}
function _inJsString(src) {
  let q = "";
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (q) { if (c === "\\") i++; else if (c === q) q = ""; }
    else if (c === "'" || c === '"' || c === "`") q = c;
  }
  return !!q;
}
/** Where does the next interpolation land, given the markup written so far? */
function _ctx(s) {
  let st = 0, tag = "", attr = "", q = "", valStart = 0, i = 0, m;
  const NAME = /\s*([^\s=>\/"']+)/y, EQ = /\s*=\s*/y;
  while (i < s.length) {
    if (st === 0) {
      const j = s.indexOf("<", i);
      if (j < 0) break;
      m = /^[A-Za-z][A-Za-z0-9-]*/.exec(s.slice(j + 1, j + 40));
      if (m) { tag = m[0].toLowerCase(); i = j + 1 + m[0].length; st = 1; attr = ""; } else i = j + 1;
    } else if (st === 1) {
      if (s[i] === ">") { st = 0; i++; continue; }
      NAME.lastIndex = i; m = NAME.exec(s);
      if (!m) { i++; continue; }
      attr = m[1].toLowerCase(); i = NAME.lastIndex;
      EQ.lastIndex = i; m = EQ.exec(s);
      if (m) { i = EQ.lastIndex; st = 2; }
    } else if (st === 2) {
      const c = s[i];
      if (c === '"' || c === "'") { q = c; valStart = i + 1; i++; st = 3; } else { q = ""; valStart = i; st = 4; }
    } else if (st === 3) {
      const j = s.indexOf(q, i);
      if (j < 0) { i = s.length; break; }
      i = j + 1; st = 1;
    } else {
      const j = s.slice(i).search(/[\s>]/);
      if (j < 0) { i = s.length; break; }
      i += j; st = 1;
    }
  }
  if (st === 3 || st === 4) return { kind: "value", tag, attr, so: s.slice(valStart) };
  if (st === 0) return { kind: "text" };
  return { kind: "tag" };
}
function _fill(v, out) {
  if (v instanceof SafeHtml) return v.s;
  if (Array.isArray(v)) return v.map((x) => _fill(x, out)).join("");
  if (v == null || v === false) return "";
  const c = _ctx(out);
  if (c.kind === "tag") return String(v).replace(/[^\w\-]/g, "");
  if (c.kind === "text") return escHtml(v);
  const { tag, attr, so } = c;
  if (attr.startsWith("on")) {
    if (_inJsString(so)) return escHtml(_jsStr(v));
    if (typeof v === "number" && Number.isFinite(v)) return String(v);
    if (typeof v === "boolean") return String(v);
    return "null"; // never splice text into bare JavaScript
  }
  if (attr === "style") return escHtml(String(v).replace(/[;{}\\<>]|url\s*\(|expression\s*\(/gi, ""));
  if (_URL_ATTRS.has(attr) && so === "") return escHtml(_safeUrl(v, tag, attr));
  return escHtml(v);
}
function html(strings, ...vals) {
  let out = "";
  for (let i = 0; i < strings.length; i++) {
    out += strings[i];
    if (i < vals.length) out += _fill(vals[i], out);
  }
  return new SafeHtml(out);
}
html.join = (arr) => { const s = arr.map((x) => _fill(x, "")).join(""); return s ? new SafeHtml(s) : ""; };
const _refs = new Map(); let _refSeq = 0;
window.__ref = (id) => _refs.get(id);
function refJs(obj) {
  _refs.set(++_refSeq, obj);
  if (_refs.size > 600) _refs.delete(_refs.keys().next().value);
  return raw(`__ref(${_refSeq})`);
}
/** Rich text written by staff (blog posts): keep formatting, drop anything active. */
function sanitizeRich(htmlStr) {
  const doc = new DOMParser().parseFromString(String(htmlStr || ""), "text/html");
  const OK = new Set(["P", "BR", "STRONG", "B", "EM", "I", "U", "UL", "OL", "LI", "A", "H1", "H2", "H3", "H4", "BLOCKQUOTE", "IMG", "FIGURE", "FIGCAPTION", "SPAN", "DIV", "HR", "CODE", "PRE", "SMALL", "SUB", "SUP", "TABLE", "THEAD", "TBODY", "TR", "TH", "TD"]);
  const walk = (node) => {
    for (const el of Array.from(node.children)) {
      if (!OK.has(el.tagName)) { el.remove(); continue; }
      for (const a of Array.from(el.attributes)) {
        const n = a.name.toLowerCase();
        const okAttr = (n === "href" && el.tagName === "A") || (n === "src" && el.tagName === "IMG") || n === "alt" || n === "title";
        if (!okAttr) { el.removeAttribute(a.name); continue; }
        if ((n === "href" || n === "src") && !_safeUrl(a.value, el.tagName.toLowerCase(), n)) el.removeAttribute(a.name);
      }
      if (el.tagName === "A") { el.setAttribute("rel", "noopener noreferrer"); el.setAttribute("target", "_blank"); }
      walk(el);
    }
  };
  walk(doc.body);
  return raw(doc.body.innerHTML);
}

/* ---- money + dates: always the record's own currency, never a guess ---- */
let _baseCurrency = "";
function money(amount, currency) {
  const c = currency || _baseCurrency || "";
  if (window.Uyeh) return window.Uyeh.fmtMoney(amount, c);
  const n = Number(amount);
  return Number.isFinite(n) ? `${c} ${n.toLocaleString()}`.trim() : "—";
}
function fmtD(v) { if (!v) return ""; return window.Uyeh ? window.Uyeh.fmtDate(v) : new Date(v).toLocaleDateString(); }
function fmtDT(v) { if (!v) return ""; return window.Uyeh ? window.Uyeh.fmtDateTime(v) : new Date(v).toLocaleString(); }

/* ============================================================
   CONFIG / SESSION
   ============================================================ */
const API_BASE = (window.Uyeh && window.Uyeh.API_BASE) || "https://uyeh-hotel-backend.onrender.com/api"; // set in config.js
function getToken() { return localStorage.getItem("guest_token"); }
function getRefreshToken() { return localStorage.getItem("guest_refresh_token"); }
function getGuest() { try { return JSON.parse(localStorage.getItem("guest_user")); } catch { return null; } }
function setSession(token, refreshToken, guest) {
  localStorage.setItem("guest_token", token);
  localStorage.setItem("guest_refresh_token", refreshToken || "");
  localStorage.setItem("guest_user", JSON.stringify(guest));
}
function clearSession() {
  localStorage.removeItem("guest_token");
  localStorage.removeItem("guest_refresh_token");
  localStorage.removeItem("guest_user");
}
const _t = (s) => (window.Uyeh ? window.Uyeh.t(s) : s);
function acceptLang() { return (window.Uyeh && window.Uyeh.acceptLanguage()) || navigator.language || "en"; }
function currentLocale() {
  const sc = window.SiteController;
  return String((sc && sc.getLocale && sc.getLocale()) || acceptLang().split(",")[0] || "en").split(";")[0].trim();
}
/** Opens a payment-provider URL only if it is a plain https/http link. */
function goTo(url) { const u = _safeUrl(url); if (u && /^https?:/i.test(u)) window.location.href = u; }
/** The session is over (refresh token rejected, or the guest logged out). */
function endSession() {
  try { if (_guestSocket) _guestSocket.disconnect(); } catch { /* already gone */ }
  _guestSocket = null;
  clearSession();
  window._guestProfile = null; window._myTickets = [];
  _orderCart = []; _myActiveBookings = []; _refs.clear();
  const pc = document.getElementById("pageContent"); if (pc) pc.innerHTML = "";
  showAuth();
}

/* ============================================================
   API — guest-scoped. The backend derives "which guest" from the
   token on every /guest/* call below; this panel never sends a
   guestId, so a guest can never view or act on another guest's
   bookings/tickets/payments by editing a request.

   IMPORTANT — paths corrected against the real backend:
   - There is no /public/* prefix anywhere. Branch listing and
     branch-scoped browsing (room types, availability, menu, bar
     menu, spa treatments, laundry items, events, reviews) all live
     directly under /branches/:branchId/... on publicRoutes.
   - Booking/ticket CREATION, cancellation, and detail-lookup are
     also on publicRoutes (branch-scoped), NOT under /guest/* — the
     /guest/* namespace only has the account-scoped LIST views
     (bookings, orders, tickets) plus profile/preferences/loyalty/
     wishlist/reviews.
   - createBooking requires a specific roomId, not a room TYPE id —
     see checkAvailability() below, which returns individual rooms.
   - Payment is a separate step after booking/order creation, not
     part of it — see initiateBookingPayment/initiateOrderPayment.
   ============================================================ */
class GuestApiError extends Error {
  constructor(message, status, data) {
    super(message); this.name = "GuestApiError";
    this.status = status || 0; this.data = data || {}; this.code = (data && data.code) || null;
  }
}
let _refreshing = null;
/** Access tokens last ~10 minutes. Refresh tokens are single-use, so every
 * call that hits a 401 at the same moment must share ONE /auth/refresh.
 * Resolves true (renewed), false (refresh token rejected: session is over)
 * or null (couldn't tell — offline/server hiccup: keep the session). */
function refreshSession() {
  if (_refreshing) return _refreshing;
  const rt = getRefreshToken();
  if (!rt) return Promise.resolve(false);
  _refreshing = (async () => {
    try {
      const res = await fetch(`${API_BASE}/auth/refresh`, {
        method: "POST", headers: { "Content-Type": "application/json", "Accept-Language": acceptLang() },
        body: JSON.stringify({ refreshToken: rt }),
      });
      if (res.status === 400 || res.status === 401) return false;
      if (!res.ok) return null;
      const data = await res.json().catch(() => ({}));
      if (!data.token) return null;
      setSession(data.token, data.refreshToken || "", getGuest());
      return true;
    } catch { return null; }
    finally { _refreshing = null; }
  })();
  return _refreshing;
}

async function guestRequest(path, options = {}, _retried = false) {
  const headers = { "Content-Type": "application/json", "Accept-Language": acceptLang(), ...(options.headers || {}) };
  const sentToken = getToken();
  if (sentToken) headers.Authorization = `Bearer ${sentToken}`;
  const startedAt = Date.now();
  let res;
  try { res = await fetch(`${API_BASE}${path}`, { ...options, headers }); }
  catch { throw new GuestApiError(_t("We couldn't reach the server. Check your connection and try again."), 0, {}); }
  // Fire-and-forget on purpose — never let tracking delay the actual
  // response getting back to the caller.
  if (typeof queueActivityEvent === "function") {
    queueActivityEvent({ type: "API_CALL", method: options.method || "GET", statusCode: res.status, durationMs: Date.now() - startedAt, metadata: { path } });
  }
  //  is just "wrong password / bad code" — show it, never log out.
  if (res.status === 401 && sentToken && !path.startsWith("/auth/")) {
    if (!_retried) {
      // another request may already have renewed the token while this one was in flight
      if (getToken() && getToken() !== sentToken) return guestRequest(path, options, true);
      const renewed = await refreshSession();
      if (renewed) return guestRequest(path, options, true);
      if (renewed === null) throw new GuestApiError(_t("We couldn't reach the server. Check your connection and try again."), 0, {});
    }
    endSession();
    throw new GuestApiError(_t("Your session has ended — please log in again."), 401, {});
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = typeof data.error === "string" && data.error ? data.error
      : res.status === 429 ? _t("Too many requests — please wait a moment and try again.")
      : `${_t("Request failed")} (${res.status})`;
    throw new GuestApiError(msg, res.status, data);
  }
  return data;
}

function switchAuthTab(tab) {
  document.querySelectorAll(".auth-tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
  document.getElementById("registerForm").style.display = tab === "register" ? "block" : "none";
  document.getElementById("authNotice").innerHTML = "";
}
function showAuthNotice(message, type = "error") {
  const d = document.createElement("div"); d.className = `notice ${type}`; d.textContent = message;
  document.getElementById("authNotice").replaceChildren(d);
}

let _pendingTempToken = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn"); btn.disabled = true; btn.textContent = "Logging in…";
  try {
    const result = await guestApi.login(document.getElementById("loginEmail").value, document.getElementById("loginPassword").value);
    if (result.requires2FA) {
      _pendingTempToken = result.tempToken;
      document.getElementById("authTabs").style.display = "none";
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("registerForm").style.display = "none";
      document.getElementById("twoFactorForm").style.display = "block";
      document.getElementById("twoFactorCode").focus();
      return;
    }
    setSession(result.token, result.refreshToken, result.guest);
    showApp();
  } catch (err) { showAuthNotice(err.message); } finally { btn.disabled = false; btn.textContent = "Log in"; }
});

document.getElementById("twoFactorForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("twoFactorBtn"); btn.disabled = true; btn.textContent = "Verifying…";
  try {
    const result = await guestApi.verifyTwoFactor(_pendingTempToken, document.getElementById("twoFactorCode").value.trim());
    _pendingTempToken = null;
    setSession(result.token, result.refreshToken, result.guest);
    showApp();
  } catch (err) { showAuthNotice(err.message); } finally { btn.disabled = false; btn.textContent = "Verify"; }
});

document.getElementById("twoFactorBackBtn").addEventListener("click", () => {
  _pendingTempToken = null;
  document.getElementById("twoFactorForm").style.display = "none";
  document.getElementById("twoFactorForm").reset();
  document.getElementById("authTabs").style.display = "flex";
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("authNotice").innerHTML = "";
});
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("registerBtn"); btn.disabled = true; btn.textContent = "Creating account…";
  try {
    const result = await guestApi.register({
      name: document.getElementById("regName").value, email: document.getElementById("regEmail").value,
      phone: document.getElementById("regPhone").value || undefined, password: document.getElementById("regPassword").value,
      locale: currentLocale(),
    });
    setSession(result.token, result.refreshToken, result.guest);
    showApp();
  } catch (err) { showAuthNotice(err.message); } finally { btn.disabled = false; btn.textContent = "Create account"; }
});

async function hydratePlatformName() {
  try {
    const { settings } = await guestApi.getSettings();
    _baseCurrency = (settings.currency && settings.currency.base) || "";
    const name = settings.platformName || settings.name || "Our Hotel";
    document.title = document.title.replace("Our Hotel", name).replace("Book Your Stay", `Book Your Stay — ${name}`);
    const authBrand = document.getElementById("authBrand"); if (authBrand) authBrand.textContent = name;
    const navBrandText = document.getElementById("navBrandText"); if (navBrandText) navBrandText.textContent = name;
    const navBrandIcon = document.getElementById("navBrandIcon"); if (navBrandIcon) navBrandIcon.textContent = name.charAt(0).toUpperCase();
  } catch (err) { /* keep the "Our Hotel" fallback already in the HTML */ }
}

  const guest = getGuest();
  document.getElementById("navUserName").textContent = guest ? guest.name : "";
  document.getElementById("navLinks").innerHTML = html.join(NAV_LINKS.map((l) => html`
    <div class="nav-link" data-page="${l.page}" onclick="switchPage('${l.page}')">

      ${l.badgeId ? html`<span class="nav-badge" id="${l.badgeId}">0</span>` : ""}

function setActiveNav(page) {
  document.querySelectorAll(".nav-link").forEach((el) => el.classList.toggle("active", el.getAttribute("data-page") === page));
}

const PAGE_LOADERS = {
  search: loadSearchPage,
  bookings: loadMyBookingsPage,
  myorders: loadMyOrdersPage,
  order: loadOrderPage,
  blog: loadBlogPage,
  events: loadEventsPage,
  upcomingevents: loadUpcomingEventsPage,
  loyalty: loadLoyaltyPage,
  wishlist: loadWishlistPage,
  support: loadSupportPage,
  profile: loadProfilePage,
};
function switchPage(page) {
  setActiveNav(page);
  const loader = PAGE_LOADERS[page];
  const container = document.getElementById("pageContent");
  if (!loader) { container.innerHTML = html`<div class="empty-state">Page not found.</div>`; return; }
  if (typeof queueActivityEvent === "function") queueActivityEvent({ type: "PAGE_VIEW", targetLabel: page });
  container.innerHTML = html`<div class="loading-state">Loading…</div>`;
  loader();
  window.scrollTo(0, 0);
}

let _searchContext = null;
let _availableRoomsCache = []; // flat list of real Room records from the last search

async function loadSearchPage() {
  const container = document.getElementById("pageContent");
  let branchOptions = html`<option value="">Loading branches…</option>`;
  try {
    const { branches } = await guestApi.listBranches();
    branchOptions = html.join(branches.map((b) => html`<option value="${b.id}">${b.name}</option>`));
  } catch { branchOptions = html`<option value="">Couldn't load branches</option>`; }

  const _now = new Date(); const today = new Date(_now.getTime() - _now.getTimezoneOffset() * 60000).toISOString().slice(0, 10); // the guest's own calendar day, not UTC

  container.innerHTML = html`
    <div class="hero">
      <h1>Find your <span>next stay</span></h1>
      <p>Search rooms across our branches and book in minutes.</p>
      <div class="search-panel">
        <div class="search-grid">
          <div class="search-field"><label>Branch</label><select id="seBranch">${branchOptions}</select></div>
          <div class="search-field"><label>Check-in</label><input type="date" id="seCheckIn" min="${today}" value="${today}"></div>
          <div class="search-field"><label>Check-out</label><input type="date" id="seCheckOut" min="${today}"></div>
          <div class="search-field"><label>Guests</label><input type="number" id="seGuests" min="1" value="1"></div>
          <button class="btn btn-primary" onclick="runRoomSearch()">Search</button>
        </div>
      </div>
    </div>
    <div id="searchNotice"></div>
    <div id="searchResults"></div>
  `;
}

async function runRoomSearch() {
  const branchId = document.getElementById("seBranch").value;
  const checkIn = document.getElementById("seCheckIn").value;
  const checkOut = document.getElementById("seCheckOut").value;
  const guests = document.getElementById("seGuests").value;
  const resultsEl = document.getElementById("searchResults");

  if (!branchId || !checkIn || !checkOut) { showNotice("searchNotice", "Pick a branch and both dates to search."); return; }
  if (checkOut <= checkIn) { showNotice("searchNotice", "Check-out must be after check-in."); return; }

  resultsEl.innerHTML = html`<div class="loading-state">Searching…</div>`;
  _searchContext = { branchId, checkIn, checkOut, guests };

  try {
    const { availableRooms } = await guestApi.checkAvailability(branchId, checkIn, checkOut);
    _availableRoomsCache = availableRooms || [];

    resultsEl.innerHTML = _availableRoomsCache.length ? html`
      <div class="room-grid">
        ${html.join(_availableRoomsCache.map((r) => html`
          <div class="room-card">
            <button class="card-heart" title="Save to wishlist" onclick="addToWishlist({branchId:'${branchId}', roomId:'${r.id}'}, 'searchNotice')"><i class="fas fa-heart"></i></button>
            ${r.images && r.images[0] ? html`<img class="card-photo" src="${r.images[0]}" alt="${r.name}">` : html`<div class="card-photo-placeholder"><i class="fa-solid fa-bed"></i></div>`}
            <h3>${r.name}</h3>
            <div class="meta">Room ${r.roomNumber} &middot; Sleeps up to ${r.maxOccupancy}</div>
            <div class="price">${money(r.basePrice, r.currency)}<span style="font-size:0.75rem; color:var(--text-muted); font-weight:400;"> / night</span></div>
            <p style="color:var(--text-muted); font-size:0.84rem; margin-bottom:14px;">${r.description || ""}</p>
            <button class="btn btn-primary btn-block" onclick='openBookingModal(${refJs(r)})'>Book this room</button>
          </div>
        `))}
      </div>
    ` : html`<div class="empty-state">No rooms available for those dates — try a different branch or date range.
        <button type="button" class="btn btn-outline" style="margin-top:10px;" onclick="joinWaitlistForSearch()">Notify me if something opens up</button>
      </div>`;
  } catch (err) {
    resultsEl.innerHTML = "";
    showNotice("searchNotice", err.message);
  }
}

function openBookingModal(room) {
  const guest = getGuest();
  const nights = Math.max(1, Math.round((new Date(_searchContext.checkOut) - new Date(_searchContext.checkIn)) / 86400000));
  const roomSubtotal = Number(room.basePrice) * nights;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "bookingModal";
  overlay.innerHTML = html`
    <div class="modal">
      <h3>Book — ${room.name} (Room ${room.roomNumber})</h3>
      <div id="bookingModalNotice"></div>
      <form id="bookingForm">
        <div class="form-row">
          <div class="form-field"><label>Guest name</label><input type="text" id="bkGuestName" value="${guest.name}" required></div>
          <div class="form-field"><label>Phone</label><input type="text" id="bkPhone" value="${guest.phone || ""}"></div>
        </div>
        <div class="form-field"><label>Special requests <span style="color:var(--text-muted); font-weight:400;">(optional)</span></label><textarea id="bkRequests" rows="2"></textarea></div>

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("Couldn't load payment script"));
    document.head.appendChild(s);
  });
}

/** Shared embedded Paystack flow for every paying page in this panel
 * (room bookings, event tickets, orders, spa) — opens in-page instead of
 * a full-page redirect to Paystack's hosted checkout, so success/failure
 * comes back in seconds and doesn't depend on the guest's browser
 * successfully following a redirect back to the site. */
async function payViaPaystackInline({ accessCode, reference, onSuccess, onFailure, onCancel }) {
  await loadScriptOnce("https://js.paystack.co/v2/inline.js");
  const popup = new PaystackPop();
  popup.resumeTransaction(accessCode, {
    onSuccess: async () => {
      try {
        await guestApi.verifyPaystackPayment(reference);
        onSuccess();
      } catch (err) {
        onFailure(err);
      }
    },
    onCancel: () => { if (onCancel) onCancel(); },
    onError: () => onFailure(new Error("Payment window couldn't open — please try again.")),
  });
}

/** Starts payment for a booking or an order and returns the provider's checkout URL
 * (null when there is nothing to pay). The server chooses Paystack or Stripe from
 * the record's own currency. Only if the server predates that endpoint (a 404 that is
 * not "…not found" for the record) does this fall back to choosing the provider here, the way it used to. */
async function startPayment(kind, rec, branchId) {
  if (kind === "order" && !(Number(rec.totalAmount) > 0)) return null; // free: nothing to charge
  const base = window.location.origin + window.location.pathname;
  try {
    const r = await (kind === "booking" ? guestApi.payBooking(rec.id, base) : guestApi.payOrder(rec.id, base));
    return r.url || null;
  } catch (err) {
    // 404 from the route itself means "no such booking/order"; any other 404 means this server has no /pay route yet.
    if (!(err.status === 404 && !/(booking|order) not found/i.test(err.message || ""))) throw err;
  }
  const bid = branchId || rec.branchId;
  let providers = ["PAYSTACK"];
  try { providers = (await guestApi.getPaymentMethods(rec.currency)).providers || []; }
  catch { /* ask Paystack and let the server decide */ }
  if (!providers.includes("PAYSTACK") && providers.includes("STRIPE")) {
    const ok = `${base}?pay=${kind}&session_id={CHECKOUT_SESSION_ID}`, no = `${base}?pay=${kind}&canceled=1`;
    const r = kind === "booking" ? await guestApi.initiateBookingStripePayment(bid, rec.id, ok, no) : await guestApi.initiateOrderStripePayment(bid, rec.id, ok, no);
    return r.checkoutUrl || null;
  }
  const r = kind === "booking" ? await guestApi.initiateBookingPayment(bid, rec.id, base) : await guestApi.initiateOrderPayment(bid, rec.id, base);
  return r.authorizationUrl || null;
}
const startBookingPayment = (branchId, booking) => startPayment("booking", booking, branchId);
/** For flows that create an order and then pay for it: if payment can't start, the
 * order still exists, so say so and point to where it can be paid. */
async function startOrderPayment(order, branchId) {
  try { return await startPayment("order", order, branchId); }
  catch (err) { throw new Error(`${err.message} Your order is saved — you can pay for it from My Orders.`); }
}
async function payPendingBooking(branchId, id, currency) {
  try {
    const url = await startPayment("booking", { id, currency, branchId }, branchId);
    if (url) goTo(url); else showNotice("myBookingsNotice", "We couldn't open the payment page. Please try again in a moment.");
  } catch (err) { showNotice("myBookingsNotice", err.message); }

async function payPendingOrder(id) {

    if (o.paymentStatus === "SUCCESSFUL") { showNotice("myOrdersNotice", "This order is already paid.", "success"); return loadMyOrdersPage(); }

    if (url) goTo(url); else showNotice("myOrdersNotice", "We couldn't open the payment page. Please try again in a moment.");
  } catch (err) { showNotice("myOrdersNotice", err.message); }

let _orderCart = []; // [{ id, name, price, quantity }] for line-item types
let _myActiveBookings = []; // this guest's CHECKED_IN bookings — powers the "charge to room" option below

/** An order can be paid online while it is unpaid, has something to charge, and is still live. */
function canPayOrder(o) {
  return Number(o.totalAmount) > 0 && o.status !== "CANCELLED" && ["PENDING", "FAILED"].includes(o.paymentStatus);
}
function orderPaymentLabel(o) {
  const map = { SUCCESSFUL: "Paid", PENDING: "Unpaid", FAILED: "Payment failed", REFUNDED: "Refunded", CHARGED_TO_ROOM: "On room bill" };
  if (!(Number(o.totalAmount) > 0)) return "—";
  return map[o.paymentStatus] || "—";
}

            </tr>

// Shows the "charge to room" checkbox only when the currently-selected
// branch matches one of the guest's own CHECKED_IN bookings — mirrors
// the backend's own requirement exactly, so this can never produce a
// request the backend would reject.
function renderOrderPaymentChoice() {
  const branchId = document.getElementById("orBranch")?.value;
  const el = document.getElementById("orderPaymentChoice");
  if (!el) return;
  const matchingBooking = _myActiveBookings.find((b) => b.branchId === branchId);
  if (!matchingBooking) { el.innerHTML = ""; return; }
  el.innerHTML = html`
    <div class="panel" style="margin-bottom:20px;">
      <label style="display:flex; align-items:center; gap:8px; font-weight:500; cursor:pointer;">
        <input type="checkbox" id="orChargeToRoom" value="${matchingBooking.id}" onchange="updateOrderSubmitLabel()">
        Charge this to Room ${matchingBooking.room.roomNumber} instead of paying now
      </label>
    </div>
  `;
}

function updateOrderSubmitLabel() {
  const chargeCheckbox = document.getElementById("orChargeToRoom");
  const btn = document.getElementById("orSubmitBtn");
  if (!btn) return;
  btn.textContent = chargeCheckbox && chargeCheckbox.checked ? "Charge to room" : "Place order & pay";
}

async function loadOrderCatalog() {
  const branchId = document.getElementById("orBranch").value;
  const type = document.getElementById("orType").value;
  const catalogEl = document.getElementById("orderCatalog");
  if (!branchId) return;
  renderOrderPaymentChoice();
  catalogEl.innerHTML = html`<div class="loading-state">Loading…</div>`;
  _orderCart = [];
  renderOrderCartSummary();

  try {
    if (type === "SPA") {
      const { spaTreatments } = await guestApi.getSpaTreatments(branchId);
      catalogEl.innerHTML = spaTreatments.length ? html`<div class="offering-grid">${html.join(spaTreatments.map((t) => html`
        <div class="offering-card">
          <b>${t.name}</b> — ${money(t.price, t.currency)} <span style="color:var(--text-muted); font-size:0.8rem;">(${t.durationMinutes} min)</span>
          <p style="font-size:0.82rem; color:var(--text-muted); margin:6px 0;">${t.description || ""}</p>
          <button class="btn btn-sm btn-primary" onclick='bookSpaTreatment(${refJs(t)})'>Book slot</button>
        </div>
      `))}</div>` : html`<div class="empty-state">No spa treatments available at this branch.</div>`;
      return;
    }

    let items = [];
    let priceField = "price", idField = "id";
    if (type === "ROOM_SERVICE" || type === "RESTAURANT") {
      const { menuItems } = await guestApi.getMenu(branchId);
      items = type === "ROOM_SERVICE" ? menuItems.filter((m) => m.availableForRoomService) : menuItems;
    } else if (type === "BAR") {
      const { menuItems } = await guestApi.getBarMenu(branchId);
      items = menuItems;
    } else if (type === "LAUNDRY") {
      const { laundryItems } = await guestApi.getLaundryItems(branchId);
      items = laundryItems;
    }

    catalogEl.innerHTML = items.length ? html`<div class="offering-grid">${html.join(items.map((it) => html`
      <div class="offering-card">
        <b>${it.name}</b> — ${money(it.price, it.currency)}
        <p style="font-size:0.82rem; color:var(--text-muted); margin:6px 0;">${it.description || ""}</p>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="number" min="1" value="1" id="qty-${it.id}" style="width:60px; padding:6px; border:1px solid var(--border,#ddd); border-radius:6px;">
          <button class="btn btn-sm btn-primary" onclick='addToOrderCart(${refJs(it)})'>Add</button>
        </div>
      </div>
    `))}</div>` : html`<div class="empty-state">Nothing available here right now.</div>`;
  } catch (err) {
    catalogEl.innerHTML = "";
    showNotice("orderNotice", err.message);
  }
}

function addToOrderCart(item) {
  const qty = Math.max(1, Number(document.getElementById(`qty-${item.id}`).value) || 1);
  const existing = _orderCart.find((l) => l.id === item.id);
  if (existing) existing.quantity += qty;
  else _orderCart.push({ id: item.id, name: item.name, price: Number(item.price), currency: item.currency, quantity: qty });
  renderOrderCartSummary();
}
function removeFromOrderCart(id) {
  _orderCart = _orderCart.filter((l) => l.id !== id);
  renderOrderCartSummary();
}
function renderOrderCartSummary() {
  const el = document.getElementById("orderCartSummary");
  if (!_orderCart.length) { el.innerHTML = ""; return; }
  const total = _orderCart.reduce((sum, l) => sum + l.price * l.quantity, 0);
  el.innerHTML = html`
    <div class="panel" style="margin-top:20px;">
      <h3 style="margin-bottom:10px;">Your order</h3>
      ${html.join(_orderCart.map((l) => html`
        <div class="summary-line"><span>${l.name} &times; ${l.quantity}</span><span>${money(l.price * l.quantity, l.currency)} <button class="btn btn-sm btn-outline" style="margin-left:8px;" onclick="removeFromOrderCart('${l.id}')">&times;</button></span></div>
      `))}
      <div class="summary-line total"><span>Total</span><span>${money(total, _orderCart[0].currency)}</span></div>
      <button class="btn btn-primary btn-block" style="margin-top:10px;" id="orSubmitBtn" onclick="submitOrder()">Place order &amp; pay</button>
    </div>
  `;
  updateOrderSubmitLabel();
}

async function submitOrder() {
  const branchId = document.getElementById("orBranch").value;
  const type = document.getElementById("orType").value;
  const chargeCheckbox = document.getElementById("orChargeToRoom");
  const chargeToRoom = !!(chargeCheckbox && chargeCheckbox.checked);
  const btn = document.getElementById("orSubmitBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Processing…"; }
  try {
    const lineField = type === "LAUNDRY" ? "laundryItemId" : "menuItemId";
    const lines = _orderCart.map((l) => ({ [lineField]: l.id, quantity: l.quantity }));
    const { order } = await guestApi.createOrder(branchId, {
      type, lines,
      ...(chargeToRoom ? { chargeToRoom: true, bookingId: chargeCheckbox.value } : {}),
    });

    if (chargeToRoom) {
      _orderCart = [];
      showNotice("orderNotice", "Charged to your room — check \"My Bookings → Room charges\" for your running balance.", "success");
      renderOrderCartSummary();
      return;
    }

    const { accessCode, reference, authorizationUrl } = await guestApi.initiateOrderPayment(branchId, order.id, window.location.origin + window.location.pathname);
    if (accessCode) {
      await payViaPaystackInline({
        accessCode, reference,
        onSuccess: () => { _orderCart = []; showNotice("orderNotice", "Order placed!", "success"); renderOrderCartSummary(); },
        onFailure: () => {
          showNotice("orderNotice", "Payment didn't go through — your order is held as pending. Try again, or contact us with your reference.");
          if (btn) { btn.disabled = false; btn.textContent = "Place order & pay"; }
        },
        onCancel: () => { if (btn) { btn.disabled = false; btn.textContent = "Place order & pay"; } },
      });
    } else if (authorizationUrl) {
      window.location.href = authorizationUrl;
    } else {
      _orderCart = [];
      showNotice("orderNotice", "Order placed!", "success");
      renderOrderCartSummary();
    }
  } catch (err) {
    showNotice("orderNotice", err.message);
    if (btn) { btn.disabled = false; btn.textContent = chargeToRoom ? "Charge to room" : "Place order & pay"; }
  }
}

function bookSpaTreatment(treatment) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay"; overlay.id = "spaModal";
  const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  const branchId = document.getElementById("orBranch").value;
  const matchingBooking = _myActiveBookings.find((b) => b.branchId === branchId);
  overlay.innerHTML = html`
    <div class="modal">
      <h3>Book — ${treatment.name}</h3>
      <div id="spaModalNotice"></div>
      <p style="color:var(--text-muted); font-size:0.86rem; margin-bottom:14px;">${treatment.durationMinutes} minutes &middot; ${money(treatment.price, treatment.currency)}</p>
      <form id="spaForm">
        <div class="form-field"><label>Date &amp; time</label><input type="datetime-local" id="spTime" min="${now.toISOString().slice(0,16)}" required></div>
        ${matchingBooking ? html`
          <div class="form-field">
            <label style="display:flex; align-items:center; gap:8px; font-weight:500; cursor:pointer;">
              <input type="checkbox" id="spChargeToRoom" value="${matchingBooking.id}" onchange="document.getElementById('spSubmitBtn').textContent = this.checked ? 'Charge to room' : 'Book & pay'">
              Charge this to Room ${matchingBooking.room.roomNumber} instead of paying now
            </label>
          </div>
        ` : ""}
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('spaModal').remove()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="spSubmitBtn">Book &amp; pay</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("spaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const branchId = document.getElementById("orBranch").value;
    const chargeCheckbox = document.getElementById("spChargeToRoom");
    const chargeToRoom = !!(chargeCheckbox && chargeCheckbox.checked);
    const btn = document.getElementById("spSubmitBtn"); btn.disabled = true;
    try {
      const { order } = await guestApi.createOrder(branchId, {
        type: "SPA", treatmentId: treatment.id, scheduledAt: new Date(document.getElementById("spTime").value).toISOString(),
        ...(chargeToRoom ? { chargeToRoom: true, bookingId: chargeCheckbox.value } : {}),
      });

      if (chargeToRoom) {
        overlay.remove();
        showNotice("orderNotice", "Spa appointment booked and charged to your room.", "success");
        return;
      }

      const { accessCode, reference, authorizationUrl } = await guestApi.initiateOrderPayment(branchId, order.id, window.location.origin + window.location.pathname);
      overlay.remove();
      if (accessCode) {
        await payViaPaystackInline({
          accessCode, reference,
          onSuccess: () => showNotice("orderNotice", "Spa appointment booked!", "success"),
          onFailure: () => showNotice("orderNotice", "Payment didn't go through — your spa booking is held as pending. Try again, or contact us with your reference."),
        });

async function openTicketThread(id) {

/* ============================================================
   ACTIVITY TRACKER — structured session timeline + stuck detection.
   See patch-039/041 notes for the design reasoning.
   ============================================================ */
const ACTIVITY_SESSION_ID = (() => {
  let id = sessionStorage.getItem("activitySessionId");
  if (!id) { id = crypto.randomUUID(); sessionStorage.setItem("activitySessionId", id); }
  return id;
})();

let _activityQueue = [];
let _stuckTracker = new Map(); // targetLabel -> { count, firstClickAt }
const STUCK_WINDOW_MS = 8000;
const STUCK_THRESHOLD = 2;

function queueActivityEvent(event) {
  _activityQueue.push({ ...event, path: window.location.pathname });
  if (_activityQueue.length >= 20) flushActivityQueue();
}

async function flushActivityQueue(useKeepalive = false) {
  if (!_activityQueue.length) return;
  const events = _activityQueue.splice(0, _activityQueue.length);
  try {
    await fetch(`${API_BASE}/activity/events`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(getToken() ? { Authorization: `Bearer ${getToken()}` } : {}) },
      body: JSON.stringify({ sessionId: ACTIVITY_SESSION_ID, events }),
      keepalive: useKeepalive, // true only on page-unload flush — lets the request survive navigation, unlike a normal fetch
    });
  } catch {
    // Tracking must never surface an error to the guest — silently drop
    // this batch. The 5-second interval + unload flush below mean a
    // single lost batch is a minor gap in the timeline, not a crisis.
  }
}
setInterval(() => flushActivityQueue(false), 5000);
window.addEventListener("pagehide", () => flushActivityQueue(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushActivityQueue(true); });

async function reportStuck(targetLabel, clickCount) {
  try {
    await fetch(`${API_BASE}/activity/stuck`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(getToken() ? { Authorization: `Bearer ${getToken()}` } : {}) },
      body: JSON.stringify({ sessionId: ACTIVITY_SESSION_ID, targetLabel, path: window.location.pathname, clickCount, windowSeconds: STUCK_WINDOW_MS / 1000 }),
    });
  } catch { /* same fail-silent reasoning as above */ }
}

function trackedLabelFor(el) {
  const tracked = el.closest("[data-track]");
  if (tracked) return tracked.getAttribute("data-track");
  if (el.id) return `#${el.id}`;
  const text = (el.textContent || "").trim().slice(0, 60);
  return text || el.tagName.toLowerCase();
}

document.addEventListener("click", (e) => {
  const interactive = e.target.closest("button, a, [role=button], input[type=submit]");
  if (!interactive) return;
  const label = trackedLabelFor(interactive);
  if (label === "ignore") return;

  queueActivityEvent({ type: "CLICK", targetLabel: label });

  const now = Date.now();
  const entry = _stuckTracker.get(label);
  if (entry && now - entry.firstClickAt <= STUCK_WINDOW_MS) {
    entry.count += 1;
    if (entry.count === STUCK_THRESHOLD) {
      reportStuck(label, entry.count);
      queueActivityEvent({ type: "STUCK", targetLabel: label, message: `${entry.count} clicks within ${STUCK_WINDOW_MS / 1000}s` });
    }
  } else {
    _stuckTracker.set(label, { count: 1, firstClickAt: now });
  }
}, true); // capture phase — sees the click even if a handler further down calls stopPropagation()

window.addEventListener("error", (e) => {
  queueActivityEvent({ type: "ERROR", message: (e.message || "Unknown error").slice(0, 500) });
});
window.addEventListener("unhandledrejection", (e) => {
  queueActivityEvent({ type: "ERROR", message: `Unhandled promise rejection: ${String(e.reason).slice(0, 500)}` });
});

/* ============================================================
   SHARED / BOOT
   ============================================================ */
/* Floating toast — for real-time events that can arrive on any page,
 * unlike showNotice() below which only targets a container already
 * on-screen. */
function toast(message, type = "info") {
  let stack = document.getElementById("toastStack");
  if (!stack) {
    stack = document.createElement("div");
    stack.id = "toastStack";
    stack.style.cssText = "position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px;";
    document.body.appendChild(stack);
  }
  const el = document.createElement("div");
  const bg = type === "error" ? "#B3261E" : type === "success" ? "#2E5339" : "#1F2937";
  el.style.cssText = `background:${bg}; color:#fff; padding:12px 16px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.2); max-width:320px; font-size:0.9rem; cursor:pointer;`;
  el.textContent = message;
  el.onclick = () => el.remove();
  stack.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* Socket.IO — one personal room per guest (user:guest:{id}), joined
 * automatically server-side on connect. Reconnects on its own; this is
 * called once from showApp() and left running for the session. */
let _guestSocket = null;
function connectGuestSocket() {
  if (_guestSocket) return;
  if (typeof io !== "function") return; // the realtime library didn't load — the panel still works without it
  // function form: every (re)connect sends the CURRENT token, not the one from first load
  _guestSocket = io(API_BASE.replace(/\/api$/, ""), { auth: (cb) => cb({ token: getToken() }) });
  let _sockRetryAt = 0;
  _guestSocket.on("connect_error", async () => {
    if (Date.now() < _sockRetryAt || !getRefreshToken()) return; // at most one renewal per 30 s
    _sockRetryAt = Date.now() + 30000;
    if (await refreshSession() && _guestSocket) _guestSocket.connect();
  });
  _guestSocket.on("notification", (n) => {
    toast(`${n.title}${n.body ? " — " + n.body : ""}`, "info");
  });
  _guestSocket.on("ticket_message", (n) => {
    toast(`${n.title}${n.body ? " — " + n.body : ""}`, "info");
    const badge = document.getElementById("supportNavBadge");
    if (badge) { badge.textContent = (parseInt(badge.textContent) || 0) + 1; badge.style.display = "inline-flex"; }
  });
}

/* Push — separate from the socket above. Socket only fires while a tab
 * is open; this is what reaches the guest when the panel is closed. */
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function isPushSubscribed() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  const reg = await navigator.serviceWorker.getRegistration("/sw-guest.js").catch(() => null);
  if (!reg) return false;
  const sub = await reg.pushManager.getSubscription();
  return !!sub;
}

async function subscribeToPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || typeof Notification === "undefined") {
    throw new Error(_t("Push notifications aren't supported on this browser"));
  }
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("Notification permission was not granted");

  const reg = await navigator.serviceWorker.register("/sw-guest.js");
  const { publicKey } = await guestApi.getPushVapidKey();
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(publicKey),
  });
  await guestApi.subscribeToPush({ ...sub.toJSON(), locale: currentLocale() });
  return true;
}

async function unsubscribeFromPush() {
  const reg = await navigator.serviceWorker.getRegistration("/sw-guest.js").catch(() => null);
  if (!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await guestApi.unsubscribeFromPush(sub.endpoint).catch(() => {});
  await sub.unsubscribe();
}

function showNotice(containerId, message, type = "error") {
  const el = document.getElementById(containerId); if (!el) return;
  const d = document.createElement("div"); d.className = `notice ${type}`; d.textContent = message;
  el.replaceChildren(d);
  setTimeout(() => { if (d.parentNode === el) el.replaceChildren(); }, type === "error" ? 8000 : 4500);
}
function showAuth() { document.getElementById("authScreen").style.display = "flex"; document.getElementById("appShell").style.display = "none"; }

/** Page-independent — deliberately not tied to any page's own notice
 * container, since switchPage()'s loader() runs async and the container
 * this needs to appear in may not exist yet the instant we know whether
 * the payment succeeded. Floats above everything instead. */
function showPaymentBanner(message, type, sticky = false) {
  const el = document.createElement("div");
  el.className = `notice ${type}`;
  el.style.cssText = "position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; max-width:520px; box-shadow:0 4px 18px rgba(0,0,0,0.18);";
  el.textContent = message;
  document.body.appendChild(el);
  if (!sticky) setTimeout(() => el.remove(), type === "success" ? 7000 : 15000);
  return el;
}

/** Runs once, from showApp(). The guest may be landing back from Paystack
 * (?reference= / ?trxref=) or from Stripe (?session_id= / ?canceled=1).
 * Step 1 (instant): read what the URL says, clean it, pick the page.
 * Step 2 (confirmPaymentReturn): ask the backend to check with the provider
 * itself — a redirect proves nothing by itself, and the webhook may be late. */
function readPaymentReturn() {
  const params = new URLSearchParams(window.location.search);
  const paystackRef = params.get("reference") || params.get("trxref");
  const stripeSession = params.get("session_id");
  const canceled = params.get("canceled") === "1";
  const payKind = params.get("pay"); // "booking" | "order" — set on Stripe return pages
  if (!paystackRef && !stripeSession && !canceled) return null;
  window.history.replaceState({}, "", window.location.pathname); // a refresh must not re-trigger this
  const isBooking = payKind ? payKind !== "order" : (!!stripeSession || canceled || String(paystackRef || "").startsWith("booking_"));
  return { paystackRef, stripeSession, canceled: canceled && !paystackRef && !stripeSession, isBooking, page: isBooking ? "bookings" : "myorders" };
}
async function confirmPaymentReturn(r) {
  if (r.canceled) {
    return { message: r.isBooking
      ? _t("Payment was cancelled — nothing was charged. Your booking stays pending until you pay or cancel it.")
      : _t("Payment was cancelled — nothing was charged. Your order stays unpaid — use Pay now in My Orders when you're ready."), type: "error" };
  }
  const FAILED = ["failed", "abandoned", "canceled", "cancelled", "reversed", "expired"];
  const ref = r.stripeSession || r.paystackRef;
  const verify = () => (r.stripeSession ? guestApi.verifyStripePayment(r.stripeSession) : guestApi.verifyPaystackPayment(r.paystackRef));
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const res = await verify();
      const isBooking = res.kind ? res.kind === "booking" : r.isBooking; // the server knows what was paid
      const page = isBooking ? "bookings" : "myorders";
      if (res.confirmed) return { message: isBooking ? _t("Payment received — your booking is confirmed.") : _t("Payment received — thank you!"), type: "success", page };
      if (FAILED.includes(String(res.status || "").toLowerCase())) {
        return { message: _t("That payment wasn't completed, so nothing was charged. You can try again from the list below."), type: "error", page };
      }
    } catch (err) {
      if (err.status === 400 || err.status === 404) break; // not a reference we can verify — stop asking
    }
    if (attempt < 3) await new Promise((ok) => setTimeout(ok, 3000));
  }
  return {
    message: `${_t("We're still waiting for the payment provider to confirm your payment. This can take a few minutes — check back shortly. If you were charged and it doesn't update, contact support with this reference:")} ${ref}`,
    type: "info",
  };
}

async function showApp() {
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  connectGuestSocket();
  renderNav();

  const paymentReturn = readPaymentReturn();
  switchPage(paymentReturn ? paymentReturn.page : "search");
  if (paymentReturn) {
    const pending = showPaymentBanner(_t("Confirming your payment…"), "info", true);
    confirmPaymentReturn(paymentReturn).then((res) => {
      pending.remove();
      showPaymentBanner(res.message, res.type);
      if (res.type !== "info") switchPage(res.page || paymentReturn.page); // show the updated status
    });
  }

  refreshSupportBadgeSilently();
}
async function refreshSupportBadgeSilently() {
  try {
    const { tickets } = await guestApi.listMyTickets();
    const openCount = tickets.filter((t) => ["OPEN","IN_PROGRESS"].includes(t.status)).length;
    const badge = document.getElementById("supportNavBadge");
    if (badge) { badge.textContent = openCount; badge.classList.toggle("visible", openCount > 0); }
  } catch { /* silent — background badge refresh */ }
}
document.getElementById("logoutBtn").addEventListener("click", async () => {
  // Revoke the refresh token server-side so a copied token can't outlive the click.
  const token = getToken(), refreshToken = getRefreshToken();
  endSession();
  if (!token) return;
  try {
    await fetch(`${API_BASE}/auth/logout`, {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ refreshToken }), keepalive: true,
    });
  } catch { /* offline — the token still expires on its own */ }
});
document.getElementById("mobileNavToggle").addEventListener("click", () => {
  const links = document.getElementById("navLinks");
  links.style.display = links.style.display === "flex" ? "none" : "flex";
  links.style.cssText += "position:absolute; top:68px; left:0; right:0; background:#14181f; flex-direction:column; padding:8px; z-index:600;";
});

// Boot
hydratePlatformName();
if (getToken() && getGuest()) { showApp(); } else { showAuth(); }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reset your password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181f;--ink-soft:#1c222b;--ivory:#f6f1e7;--brass:#b98d45;--brass-light:#d9b876;--danger:#d96a5b;--ok:#5fb3a1;--line:rgba(237,230,214,.16)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 10% 0%,rgba(47,93,90,.4),transparent 60%),var(--ink);color:var(--ivory);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.card{width:100%;max-width:440px;background:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:38px 34px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.brand{font-family:Fraunces,Georgia,serif;font-size:1.2rem;margin-bottom:26px}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:1.9rem;line-height:1.1;margin-bottom:8px}
p.sub{color:rgba(237,230,214,.7);font-size:.95rem;margin-bottom:22px}
label{display:block;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(237,230,214,.6);margin:16px 0 6px}
input{width:100%;padding:13px 14px;border-radius:3px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ivory);font:inherit}
input:focus{outline:2px solid var(--brass-light);outline-offset:1px}
button,.btn{display:block;width:100%;margin-top:24px;padding:14px;border:0;border-radius:999px;background:var(--brass);color:var(--ink);font:600 .95rem Inter,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:16px;padding:12px 14px;border-radius:3px;font-size:.9rem}
.msg.err{background:rgba(217,106,91,.12);color:#f2b3aa;border:1px solid rgba(217,106,91,.4)}
.msg.ok{background:rgba(95,179,161,.12);color:#a6dccf;border:1px solid rgba(95,179,161,.4)}
.hint{font-size:.78rem;color:rgba(237,230,214,.5);margin-top:6px}
</style>
<script src="config.js"></script>
</head>
<body>
<main class="card">
  <div class="brand" id="brand">Uyeh Hotel</div>
  <h1>Choose a new password</h1>
  <p class="sub" id="who">Enter a new password for your account.</p>
  <form id="form" novalidate>
    <label for="pw">New password</label>
    <input id="pw" type="password" minlength="8" autocomplete="new-password" required>
    <div class="hint">At least 8 characters.</div>
    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit" id="btn">Update password</button>
  </form>
  <div id="out" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  "use strict";
  var API = (window.__API_BASE__ || "/api").replace(/\/$/, "");
  var q = new URLSearchParams(location.search), token = q.get("token"), type = (q.get("type") || "").toLowerCase();
  var TYPES = { staff: "staff", manager: "manager", director: "director" };
  var LOGIN = { staff: "board/staff-panel.html", manager: "board/manager-panel.html", director: "board/director-panel.html" };
  var $ = function (id) { return document.getElementById(id); };
  function say(cls, text, loginLink) {
    var d = $("out"); d.innerHTML = "";
    var m = document.createElement("div"); m.className = "msg " + cls; m.textContent = text; d.appendChild(m);
    if (loginLink) { var a = document.createElement("a"); a.className = "btn"; a.href = loginLink; a.textContent = "Go to log in"; d.appendChild(a); }
  }
  if (type === "guest") { // guest links belong to the guest panel
    location.replace((window.__GUEST_PORTAL__ || "guest-panel.html") + "?action=reset-password&type=guest&token=" + encodeURIComponent(token || ""));
    return;
  }
  if (!token || !TYPES[type]) {
    $("form").style.display = "none";
    say("err", "This reset link looks incomplete. Please open the link from your email again, or request a new one.");
    return;
  }
  $("who").textContent = "Enter a new password for your " + type + " account.";
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var a = $("pw").value, b = $("pw2").value;
    if (a.length < 8) return say("err", "Your password must be at least 8 characters.");
    if (a !== b) return say("err", "The two passwords don't match.");
    var btn = $("btn"); btn.disabled = true; btn.textContent = "Updating…";
    fetch(API + "/auth/" + TYPES[type] + "/reset-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, newPassword: a }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d.error || "We couldn't reset your password. The link may have expired. Request a new one.");
        $("form").style.display = "none";
        say("ok", res.d.message || "Password updated. Please log in again.", LOGIN[type]);
      })
      .catch(function (err) { say("err", err.message); btn.disabled = false; btn.textContent = "Update password"; });
  });
})();
</script>
</body>
</html>

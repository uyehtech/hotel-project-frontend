<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… — Our Hotel</title>
<meta name="robots" content="noindex">
<!--
  This page is intentionally retired. It used to be a second, divergent
  "Solace House"-branded room listing pulling from external css/js files
  outside this repo — redundant with location.html, which is the real,
  working, type-availability-backed room search. Confirmed nothing else
  in the site links here anymore (checked directly across every page).

  This stays as a redirect rather than a hard delete/404 specifically
  because the URL may already be bookmarked or indexed by a search
  engine — a clean redirect preserves that traffic instead of losing it
  to a dead link. If analytics confirm zero real hits on this path after
  a reasonable window, it's safe to delete the file outright at that point.
-->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta http-equiv="refresh" content="0; url=location.html">
<link rel="canonical" href="location.html">
<style>
  body { font-family: -apple-system, sans-serif; background: #0e1116; color: #ede6d6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
  a { color: #d9b876; }
</style>
</head>
<body>
  <p>Taking you to <a href="location.html">our room search</a>&hellip;</p>
  <script>window.location.replace("location.html");</script>
</body>
</html>
